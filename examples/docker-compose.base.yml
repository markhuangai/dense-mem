# Dense-Mem base compose example.
#
# Download this file as docker-compose.yml for a local-only setup:
#   curl -fsSLo docker-compose.yml \
#     https://raw.githubusercontent.com/markhuangai/dense-mem/main/examples/docker-compose.base.yml
#
# Required .env values:
#   POSTGRES_PASSWORD
#   CONTROL_PORTAL_TOKEN
#   AI_API_KEY
#
# The server also requires AI_API_URL, AI_API_EMBEDDING_MODEL, and
# AI_API_EMBEDDING_DIMENSIONS. This compose example supplies OpenAI defaults
# below; set them in .env when using another provider or model.
#
# This example exposes Dense-Mem only on localhost:
#   MCP/API:        http://127.0.0.1:8080/mcp
#   User portal:    http://127.0.0.1:8080/ui
#   Control portal: http://127.0.0.1:8090/
#
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-densemem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-densemem}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-densemem}\" -d \"${POSTGRES_DB:-densemem}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  server:
    image: ghcr.io/markhuangai/dense-mem:latest
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONTROL_HTTP_ADDR: ${CONTROL_HTTP_ADDR:-:8090}
      CONTROL_PORTAL_TOKEN: ${CONTROL_PORTAL_TOKEN:?CONTROL_PORTAL_TOKEN must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:-densemem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-densemem}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_OPEN_CONNS: ${POSTGRES_MAX_OPEN_CONNS:-25}
      POSTGRES_MAX_IDLE_CONNS: ${POSTGRES_MAX_IDLE_CONNS:-10}
      POSTGRES_CONN_MAX_LIFETIME_SECONDS: ${POSTGRES_CONN_MAX_LIFETIME_SECONDS:-1800}
      REDIS_ADDR: ""
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}
      DISTRIBUTED_COORDINATION_REQUIRED: ${DISTRIBUTED_COORDINATION_REQUIRED:-false}
      AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY must be set in .env}
      AI_API_EMBEDDING_MODEL: ${AI_API_EMBEDDING_MODEL:-text-embedding-3-large}
      AI_API_EMBEDDING_DIMENSIONS: ${AI_API_EMBEDDING_DIMENSIONS:-3072}
      AI_API_EMBEDDING_TIMEOUT_SECONDS: ${AI_API_EMBEDDING_TIMEOUT_SECONDS:-30}
      AI_VERIFIER_API_URL: ${AI_VERIFIER_API_URL:-}
      AI_VERIFIER_API_KEY: ${AI_VERIFIER_API_KEY:-}
      AI_VERIFIER_MODEL: ${AI_VERIFIER_MODEL:-gpt-4o-mini}
      AI_VERIFIER_DISABLE_TEMPERATURE: ${AI_VERIFIER_DISABLE_TEMPERATURE:-false}
      AI_VERIFIER_TIMEOUT_SECONDS: ${AI_VERIFIER_TIMEOUT_SECONDS:-60}
      AI_VERIFIER_MAX_CONCURRENCY: ${AI_VERIFIER_MAX_CONCURRENCY:-5}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      TELEMETRY_PROMETHEUS_URL: ${TELEMETRY_PROMETHEUS_URL:-}
      TELEMETRY_PROMETHEUS_JOB: ${TELEMETRY_PROMETHEUS_JOB:-}
      TELEMETRY_QUERY_TIMEOUT_SECONDS: ${TELEMETRY_QUERY_TIMEOUT_SECONDS:-5}
      TELEMETRY_SCRAPE_TOKEN: ${TELEMETRY_SCRAPE_TOKEN:-}
    ports:
      - "127.0.0.1:${DENSE_MEM_PORT:-8080}:8080"
      - "127.0.0.1:${CONTROL_PORTAL_PORT:-8090}:8090"
    # Lets AI_API_URL reach an OpenAI-compatible provider running on the
    # Docker host (for example Ollama at http://host.docker.internal:11434/v1).
    # Docker Desktop defines host.docker.internal already; this mapping makes
    # the same URL work on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  private:
