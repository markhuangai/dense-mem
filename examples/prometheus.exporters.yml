global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: dense-mem
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/telemetry-scrape-token
    static_configs:
      - targets: [server:8090]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
