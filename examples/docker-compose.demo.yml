# Dense-Mem public demo compose example.
#
# This stack runs the separate demo image, not the official release image:
#   ghcr.io/markhuangai/dense-mem:demo
#
# Required .env values:
#   POSTGRES_PASSWORD
#   AI_API_KEY
#   AI_REVIEWER_MODEL
#   AI_VERIFIER_MODEL
#
# Set DEMO_PUBLIC_BASE_URL when serving behind a public URL, for example:
#   DEMO_PUBLIC_BASE_URL=https://demo-dense-mem.example.com
#
# The demo is for disposable test data only. It provisions isolated teams with
# expiring API keys, enforces demo quotas, and runs cleanup every 10 minutes.

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-densemem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-densemem_demo}
    volumes:
      - demo-postgres-data:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-densemem}\" -d \"${POSTGRES_DB:-densemem_demo}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - demo-redis-data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  demo:
    image: ${DENSE_MEM_DEMO_IMAGE:-ghcr.io/markhuangai/dense-mem:demo}
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEMO_PUBLIC_BASE_URL: ${DEMO_PUBLIC_BASE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:-densemem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-densemem_demo}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_OPEN_CONNS: ${POSTGRES_MAX_OPEN_CONNS:-25}
      POSTGRES_MAX_IDLE_CONNS: ${POSTGRES_MAX_IDLE_CONNS:-10}
      POSTGRES_CONN_MAX_LIFETIME_SECONDS: ${POSTGRES_CONN_MAX_LIFETIME_SECONDS:-1800}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      REDIS_TLS_ENABLED: "false"
      AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY must be set in .env}
      AI_API_EMBEDDING_MODEL: ${AI_API_EMBEDDING_MODEL:-text-embedding-3-large}
      AI_API_EMBEDDING_DIMENSIONS: ${AI_API_EMBEDDING_DIMENSIONS:-3072}
      AI_API_EMBEDDING_TIMEOUT_SECONDS: ${AI_API_EMBEDDING_TIMEOUT_SECONDS:-30}
      AI_VERIFIER_API_URL: ${AI_VERIFIER_API_URL:-}
      AI_VERIFIER_API_KEY: ${AI_VERIFIER_API_KEY:-}
      AI_REVIEWER_MODEL: ${AI_REVIEWER_MODEL:?AI_REVIEWER_MODEL must be set in .env}
      AI_VERIFIER_MODEL: ${AI_VERIFIER_MODEL:?AI_VERIFIER_MODEL must be set in .env}
      AI_VERIFIER_DISABLE_TEMPERATURE: ${AI_VERIFIER_DISABLE_TEMPERATURE:-false}
      AI_VERIFIER_TIMEOUT_SECONDS: ${AI_VERIFIER_TIMEOUT_SECONDS:-60}
      AI_VERIFIER_MAX_CONCURRENCY: ${AI_VERIFIER_MAX_CONCURRENCY:-5}
      AUTH_VERIFY_MAX_CONCURRENCY: ${AUTH_VERIFY_MAX_CONCURRENCY:-8}
      HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-1048576}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-30}
      SSE_MAX_DURATION_SECONDS: ${SSE_MAX_DURATION_SECONDS:-300}
      SSE_MAX_CONCURRENT_STREAMS: ${SSE_MAX_CONCURRENT_STREAMS:-10}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      TELEMETRY_PROMETHEUS_URL: ${TELEMETRY_PROMETHEUS_URL:-}
      TELEMETRY_PROMETHEUS_JOB: ${TELEMETRY_PROMETHEUS_JOB:-}
      TELEMETRY_QUERY_TIMEOUT_SECONDS: ${TELEMETRY_QUERY_TIMEOUT_SECONDS:-5}
      TELEMETRY_SCRAPE_TOKEN: ${TELEMETRY_SCRAPE_TOKEN:-}
    expose:
      - "8091"
    ports:
      - "${DENSE_MEM_DEMO_BIND:-127.0.0.1}:${DENSE_MEM_DEMO_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - private
    restart: unless-stopped

volumes:
  demo-postgres-data:
  demo-redis-data:

networks:
  private:
