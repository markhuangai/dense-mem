# Dense-Mem public demo compose example.
#
# Download this file as docker-compose.yml when you want to host the disposable
# 24-hour demo service:
#   curl -fsSLo docker-compose.yml \
#     https://raw.githubusercontent.com/markhuangai/dense-mem/main/examples/docker-compose.demo.yml
#
# This stack runs the separate demo image, not the official release image:
#   ghcr.io/markhuangai/dense-mem:demo
#
# Required .env values:
#   POSTGRES_PASSWORD
#   NEO4J_PASSWORD
#   AI_API_KEY
#
# Set DEMO_PUBLIC_BASE_URL when serving behind a real public URL, for example:
#   DEMO_PUBLIC_BASE_URL=https://demo-dense-mem.example.com
#
# The demo is for disposable test data only. It provisions isolated teams with
# expiring API keys, enforces demo quotas, and runs cleanup every 10 minutes.
# Do not use this compose file to host production memory data.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-densemem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-densemem_demo}
    volumes:
      - demo-postgres-data:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-densemem}\" -d \"${POSTGRES_DB:-densemem_demo}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - demo-neo4j-data:/data
      - demo-neo4j-logs:/logs
    networks:
      - private
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          wget -q --spider http://127.0.0.1:7474
          && cypher-shell -u "${NEO4J_USER:-neo4j}" -p "${NEO4J_PASSWORD}" 'RETURN 1' >/dev/null 2>&1
          || exit 1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - demo-redis-data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  demo:
    image: ${DENSE_MEM_DEMO_IMAGE:-ghcr.io/markhuangai/dense-mem:demo}
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEMO_PUBLIC_BASE_URL: ${DEMO_PUBLIC_BASE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:-densemem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-densemem_demo}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY must be set in .env}
      AI_API_EMBEDDING_MODEL: ${AI_API_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_API_EMBEDDING_DIMENSIONS: ${AI_API_EMBEDDING_DIMENSIONS:-1536}
      AI_API_EMBEDDING_TIMEOUT_SECONDS: ${AI_API_EMBEDDING_TIMEOUT_SECONDS:-30}
      AI_VERIFIER_API_URL: ${AI_VERIFIER_API_URL:-}
      AI_VERIFIER_API_KEY: ${AI_VERIFIER_API_KEY:-}
      AI_VERIFIER_MODEL: ${AI_VERIFIER_MODEL:-gpt-4o-mini}
      AI_VERIFIER_TIMEOUT_SECONDS: ${AI_VERIFIER_TIMEOUT_SECONDS:-60}
      AI_VERIFIER_MAX_CONCURRENCY: ${AI_VERIFIER_MAX_CONCURRENCY:-5}
      AUTH_VERIFY_MAX_CONCURRENCY: ${AUTH_VERIFY_MAX_CONCURRENCY:-8}
      HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-1048576}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      FRAGMENT_CREATE_RATE_LIMIT: ${FRAGMENT_CREATE_RATE_LIMIT:-60}
      FRAGMENT_READ_RATE_LIMIT: ${FRAGMENT_READ_RATE_LIMIT:-300}
      CLAIM_WRITE_RATE_LIMIT: ${CLAIM_WRITE_RATE_LIMIT:-60}
      CLAIM_READ_RATE_LIMIT: ${CLAIM_READ_RATE_LIMIT:-300}
      SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-30}
      SSE_MAX_DURATION_SECONDS: ${SSE_MAX_DURATION_SECONDS:-300}
      SSE_MAX_CONCURRENT_STREAMS: ${SSE_MAX_CONCURRENT_STREAMS:-10}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      TELEMETRY_PROMETHEUS_URL: ${TELEMETRY_PROMETHEUS_URL:-}
      TELEMETRY_PROMETHEUS_JOB: ${TELEMETRY_PROMETHEUS_JOB:-}
      TELEMETRY_QUERY_TIMEOUT_SECONDS: ${TELEMETRY_QUERY_TIMEOUT_SECONDS:-5}
      TELEMETRY_SCRAPE_TOKEN: ${TELEMETRY_SCRAPE_TOKEN:-}
    expose:
      - "8091"
    ports:
      - "${DENSE_MEM_DEMO_BIND:-127.0.0.1}:${DENSE_MEM_DEMO_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - private
    restart: unless-stopped

volumes:
  demo-postgres-data:
  demo-neo4j-data:
  demo-neo4j-logs:
  demo-redis-data:

networks:
  private:
