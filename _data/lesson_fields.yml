  contract: [retract_evidence, request, evidence_ids]
usage-requests:
  path: data.system.requests
  type: integer
  value: 1
  from: "Usage metrics writer · request buckets"
  to: "GET /control/api/metrics"
  use: "The writer persists request counts in usage buckets. The endpoint reads the requested window and returns the total for that window."
