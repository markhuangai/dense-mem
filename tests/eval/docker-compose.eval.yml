# Eval-only persistence override for the root docker-compose.yml.
#
# Use with:
#   docker compose -p densemem_eval_full \
#     -f docker-compose.yml \
#     -f tests/eval/docker-compose.eval.yml up -d --build

services:
  server:
    environment:
      RATE_LIMIT_PER_MINUTE: "200000"
      FRAGMENT_CREATE_RATE_LIMIT: "200000"
      FRAGMENT_READ_RATE_LIMIT: "200000"
      CLAIM_WRITE_RATE_LIMIT: "200000"
      CLAIM_READ_RATE_LIMIT: "200000"

  postgres:
    volumes:
      - ${V1_COMPOSE_DATA_DIR:-./tests/eval/runtime/v1}/postgres:/var/lib/postgresql

  neo4j:
    volumes:
      - ${V1_COMPOSE_DATA_DIR:-./tests/eval/runtime/v1}/neo4j/data:/data
      - ${V1_COMPOSE_DATA_DIR:-./tests/eval/runtime/v1}/neo4j/logs:/logs
      - ${V1_COMPOSE_DATA_DIR:-./tests/eval/runtime/v1}/neo4j/plugins:/plugins

  redis:
    volumes:
      - ${V1_COMPOSE_DATA_DIR:-./tests/eval/runtime/v1}/redis:/data

  prometheus:
    volumes:
      - ${V1_COMPOSE_DATA_DIR:-./tests/eval/runtime/v1}/prometheus:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
