# Submission-evaluation persistence override for the root docker-compose.yml.
#
# Use with:
#   docker compose -p densemem_eval_submission \
#     -f docker-compose.yml \
#     -f tests/eval/docker-compose.eval.yml up -d --build

services:
  server:
    environment:
      RATE_LIMIT_PER_MINUTE: "200000"
      AI_VERIFIER_MAX_CONCURRENCY: "${AI_VERIFIER_MAX_CONCURRENCY:-5}"
      SUBMISSION_ASSESSMENT_WORKER_COUNT: "${SUBMISSION_ASSESSMENT_WORKER_COUNT:-1}"

  postgres:
    volumes:
      - ${EVAL_COMPOSE_DATA_DIR:-./tests/eval/runtime/v2}/postgres:/var/lib/postgresql

  redis:
    volumes:
      - ${EVAL_COMPOSE_DATA_DIR:-./tests/eval/runtime/v2}/redis:/data

  prometheus:
    user: "0:0"
    volumes:
      - ${EVAL_COMPOSE_DATA_DIR:-./tests/eval/runtime/v2}/prometheus:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
