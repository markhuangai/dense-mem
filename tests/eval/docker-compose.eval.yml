# Eval-only persistence override for the root docker-compose.yml.
#
# Use with:
#   docker compose -p densemem_eval_full \
#     -f docker-compose.yml \
#     -f tests/eval/docker-compose.eval.yml up -d --build

services:
  server:
    environment:
      RATE_LIMIT_PER_MINUTE: "200000"
      AI_API_EMBEDDING_TIMEOUT_SECONDS: "${DENSE_MEM_EVAL_EMBEDDING_TIMEOUT_SECONDS:-600}"
      AI_API_EMBEDDING_MAX_CONCURRENCY: "${DENSE_MEM_EVAL_EMBEDDING_MAX_CONCURRENCY:-10}"
      EMBEDDING_WORKER_COUNT: "${DENSE_MEM_EVAL_EMBEDDING_WORKER_COUNT:-10}"

  postgres:
    volumes:
      - ${V1_COMPOSE_DATA_DIR:-./tests/eval/runtime/v1}/postgres:/var/lib/postgresql

  redis:
    volumes:
      - ${V1_COMPOSE_DATA_DIR:-./tests/eval/runtime/v1}/redis:/data

  prometheus:
    user: "0:0"
    volumes:
      - ${V1_COMPOSE_DATA_DIR:-./tests/eval/runtime/v1}/prometheus:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
