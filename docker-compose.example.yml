# Dense-Mem docker compose TEMPLATE.
#
# Copy this file to docker-compose.yml (gitignored) and adjust as needed.
# A matching .env file must live beside it — use .env.example as a starting
# point and set at minimum POSTGRES_PASSWORD, NEO4J_PASSWORD, and
# CONTROL_PORTAL_TOKEN.
#
# Required env in .env:
#   POSTGRES_PASSWORD         Postgres password for the postgres container
#   NEO4J_PASSWORD            Neo4j password (user defaults to "neo4j")
#   CONTROL_PORTAL_TOKEN      Token for the local profile/API-key portal
#   POSTGRES_HOST, _USER, _DB, _PORT, _SSLMODE  (for the entrypoint to
#                             assemble POSTGRES_DSN — see docker-entrypoint.sh)
#
# Optional env (sensible defaults — see .env for the full list):
#   NEO4J_USER, NEO4J_DATABASE
#   REDIS_PASSWORD, REDIS_DB, REDIS_PORT
#   DENSE_MEM_DOMAIN, ACME_EMAIL, DENSE_MEM_PUBLIC_NETWORK,
#   DENSE_MEM_PUBLIC_NETWORK_EXTERNAL, TRAEFIK_* when enabling the traefik
#   profile
#
# The image entrypoint (/app/docker-entrypoint.sh) builds POSTGRES_DSN from
# its component env vars at container start, so no credentialed connection
# string literal appears in this file, in .env, or anywhere else on disk.
#
# Postgres migrations run during server startup after postgres is healthy and
# before schema-dependent checks run.

services:
  traefik:
    profiles: ["traefik"]
    image: traefik:v3
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--accesslog=true"
      - "--log.level=INFO"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    networks:
      - public
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-densemem}\" -d \"${POSTGRES_DB:-densemem}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  neo4j:
    # Default local/dev setup: Neo4j Community with the Graph Data Science plugin.
    # Enterprise + GDS is supported by dense-mem, but is not bundled here.
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    networks:
      - private
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          wget -q --spider http://127.0.0.1:7474
          && cypher-shell -u "${NEO4J_USER:-neo4j}" -p "${NEO4J_PASSWORD}" 'RETURN 1' >/dev/null 2>&1
          || exit 1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  redis:
    # Redis is optional for single-node and required for multi-instance.
    profiles: ["redis"]
    image: redis:7-alpine
    env_file:
      - .env
    command: >
      redis-server
      --appendonly yes
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  server:
    image: ghcr.io/markhuangai/dense-mem:latest
    env_file:
      - .env
    expose:
      - "8080"
    ports:
      - "${CONTROL_PORTAL_BIND:-127.0.0.1}:${CONTROL_PORTAL_PORT:-8090}:8090"
    environment:
      POSTGRES_HOST: postgres
      NEO4J_URI: bolt://neo4j:7687
      REDIS_ADDR: "${REDIS_ADDR:-}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${DENSE_MEM_PUBLIC_NETWORK:-dense-mem-public}"
      - "traefik.http.routers.densemem.rule=Host(`${DENSE_MEM_DOMAIN:-localhost}`)"
      - "traefik.http.routers.densemem.entrypoints=websecure"
      - "traefik.http.routers.densemem.tls=true"
      - "traefik.http.routers.densemem.tls.certresolver=letsencrypt"
      - "traefik.http.routers.densemem.middlewares=densemem-secure-headers,densemem-compress,densemem-rate-limit,densemem-buffer,densemem-inflight"
      - "traefik.http.services.densemem.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.densemem-secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.densemem-secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.densemem-secure-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.densemem-secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.densemem-secure-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.densemem-secure-headers.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.densemem-secure-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.densemem-compress.compress=true"
      - "traefik.http.middlewares.densemem-rate-limit.rateLimit.average=${TRAEFIK_RATE_AVERAGE:-60}"
      - "traefik.http.middlewares.densemem-rate-limit.rateLimit.period=${TRAEFIK_RATE_PERIOD:-1m}"
      - "traefik.http.middlewares.densemem-rate-limit.rateLimit.burst=${TRAEFIK_RATE_BURST:-30}"
      - "traefik.http.middlewares.densemem-buffer.buffering.maxRequestBodyBytes=${TRAEFIK_MAX_BODY_BYTES:-1048576}"
      - "traefik.http.middlewares.densemem-inflight.inFlightReq.amount=${TRAEFIK_INFLIGHT_REQUESTS:-32}"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - public
      - private
    restart: unless-stopped

volumes:
  traefik-acme:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  neo4j-plugins:
  redis-data:

networks:
  public:
    name: ${DENSE_MEM_PUBLIC_NETWORK:-dense-mem-public}
    external: ${DENSE_MEM_PUBLIC_NETWORK_EXTERNAL:-false}
  private:
