self-hosted-runner:
  labels:
    - docker-runner
    - rootless-docker
    - home-server
    - bash
    - non-root

# GitHub supports concurrency.queue: max, but actionlint does not parse it yet.
paths:
  .github/workflows/development-e2e-cleanup.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/pr-image-cleanup.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/release-rc.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/release.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/start-prerelease.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
