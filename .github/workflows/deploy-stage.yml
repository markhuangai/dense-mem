name: Deploy staging

run-name: Deploy staging · ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Dense-Mem image tag to deploy."
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: release-version-tags
  cancel-in-progress: false
  queue: max

jobs:
  authorize:
    name: Authorize staging deployment
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.authorize.outputs.revision }}
      tag: ${{ steps.authorize.outputs.tag }}

    steps:
      - name: Authorize actor and resolve rehearsal revision
        id: authorize
        uses: actions/github-script@v9
        env:
          DISPATCH_REF: ${{ github.ref }}
          IMAGE_TAG: ${{ inputs.tag }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const actor = "Z-M-Huang";
            const tag = process.env.IMAGE_TAG;
            if (context.actor !== actor || process.env.TRIGGERING_ACTOR !== actor) {
              throw new Error("Only Z-M-Huang may deploy staging.");
            }
            if (process.env.DISPATCH_REF !== "refs/heads/main") {
              throw new Error("Staging deployments must be dispatched from main.");
            }
            if (!/^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$/.test(tag)) {
              throw new Error("A valid image tag is required.");
            }

            const preview = /^test-([1-9][0-9]*)$/.exec(tag);
            const revision = preview ? `refs/pull/${preview[1]}/head` : tag;
            core.setOutput("revision", revision);
            core.setOutput("tag", tag);

  staging-migration-rehearsal:
    name: Restore production copy and rehearse migrations
    needs: authorize
    uses: ./.github/workflows/staging-migration-rehearsal.yml
    with:
      revision: ${{ needs.authorize.outputs.revision }}
    secrets: inherit

  deploy-staging:
    name: Deploy staging image
    needs: [authorize, staging-migration-rehearsal]
    if: >-
      ${{
        needs.authorize.result == 'success' &&
        needs.staging-migration-rehearsal.result == 'success'
      }}
    permissions:
      contents: read
      packages: read
    runs-on: [home-server, bash, non-root]
    timeout-minutes: 75
    environment: staging

    steps:
      - name: Checkout trusted staging deployment helper
        uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Pull and deploy requested image
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ needs.authorize.outputs.tag }}
          EXPECTED_REVISION: ${{ needs.staging-migration-rehearsal.outputs.revision }}
        run: |
          set -euo pipefail

          timeout --signal=TERM --kill-after=60s --verbose 70m bash -euo pipefail <<'DEPLOY'
          docker_config="${RUNNER_TEMP}/dense-mem-staging-docker"
          mkdir -p "${docker_config}"
          export DOCKER_CONFIG="${docker_config}"
          printf '%s' "${GHCR_TOKEN}" |
            docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          unset GHCR_TOKEN

          exec .github/scripts/deploy-staging-image.sh \
            "${HOME}/dense-mem-stage" "${IMAGE_TAG}" "${EXPECTED_REVISION}"
          DEPLOY

  deployment-result:
    name: Report staging deployment outcome
    needs: [authorize, staging-migration-rehearsal, deploy-staging]
    if: always() && !cancelled() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Require healthy compatible recovery
        env:
          DEPLOY_RESULT: ${{ needs.deploy-staging.result }}
          REHEARSAL_RESULT: ${{ needs.staging-migration-rehearsal.result }}
        run: |
          if [[ "${DEPLOY_RESULT}" != success ]]; then
            {
              echo '## Staging recovery incomplete'
              echo "- Rehearsal: ${REHEARSAL_RESULT}"
              echo "- Deployment: ${DEPLOY_RESULT}"
              echo 'No fallback image was restarted. Inspect staging and dispatch Deploy staging from main with a compatible image tag.'
            } >> "${GITHUB_STEP_SUMMARY}"
            echo '::error::Staging recovery did not complete; inspect the failed rehearsal or deployment.'
            exit 1
          fi
