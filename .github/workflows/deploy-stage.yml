name: Deploy staging

run-name: Deploy staging · ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Dense-Mem image tag to deploy."
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: dense-mem-staging-deployment
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize staging deployment
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.authorize.outputs.revision }}
      tag: ${{ steps.authorize.outputs.tag }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
      main_sha: ${{ steps.authorize.outputs.main_sha }}
      preview_pr: ${{ steps.authorize.outputs.preview_pr }}

    steps:
      - name: Authorize actor and resolve rehearsal revision
        id: authorize
        uses: actions/github-script@v9
        env:
          DISPATCH_REF: ${{ github.ref }}
          IMAGE_TAG: ${{ inputs.tag }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const actor = "Z-M-Huang";
            const tag = process.env.IMAGE_TAG;
            if (context.actor !== actor || process.env.TRIGGERING_ACTOR !== actor) {
              throw new Error("Only Z-M-Huang may deploy staging.");
            }
            if (process.env.DISPATCH_REF !== "refs/heads/main") {
              throw new Error("Staging deployments must be dispatched from main.");
            }

            const preview = /^test-([1-9][0-9]*)$/.exec(tag);
            const mainSha = context.sha;
            if (!/^[0-9a-f]{40}$/.test(mainSha)) {
              throw new Error("The dispatch main revision is invalid.");
            }
            let headSha = "";
            let previewPr = "";
            if (preview) {
              const pull = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(preview[1]),
              });
              if (
                pull.data.state !== "open" ||
                pull.data.base.ref !== "main" ||
                !/^[0-9a-f]{40}$/.test(pull.data.head.sha)
              ) {
                throw new Error("The preview pull request is not an open main PR at a valid head.");
              }
              headSha = pull.data.head.sha;
              previewPr = preview[1];
            }
            const revision = preview ? `refs/pull/${preview[1]}/head` : tag;
            core.setOutput("revision", revision);
            core.setOutput("tag", tag);
            core.setOutput("head_sha", headSha);
            core.setOutput("main_sha", mainSha);
            core.setOutput("preview_pr", previewPr);

  staging-migration-rehearsal:
    name: Restore production copy and rehearse migrations
    needs: authorize
    uses: ./.github/workflows/staging-migration-rehearsal.yml
    with:
      revision: ${{ needs.authorize.outputs.revision }}
    secrets: inherit

  deploy-staging:
    name: Deploy staging image
    needs: [authorize, staging-migration-rehearsal]
    if: >-
      ${{
        needs.authorize.result == 'success' &&
        needs.staging-migration-rehearsal.result == 'success'
      }}
    permissions:
      contents: read
      packages: read
    runs-on: [home-server, bash, non-root]
    timeout-minutes: 60
    environment: staging

    steps:
      - name: Pull and deploy requested image
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ needs.authorize.outputs.tag }}
          EXPECTED_HEAD: ${{ needs.authorize.outputs.head_sha }}
          EXPECTED_MAIN: ${{ needs.authorize.outputs.main_sha }}
          EXPECTED_PREVIEW_PR: ${{ needs.authorize.outputs.preview_pr }}
        run: |
          set -euo pipefail

          stage_dir="${HOME}/dense-mem-stage"
          if [[ ! -d "${stage_dir}" ]]; then
            echo "::error::The staging directory is missing"
            exit 1
          fi
          cd "${stage_dir}"

          docker_config="${RUNNER_TEMP}/dense-mem-staging-docker"
          mkdir -p "${docker_config}"
          export DOCKER_CONFIG="${docker_config}"
          printf '%s' "${GHCR_TOKEN}" |
            docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          unset GHCR_TOKEN

          exec 9>"${HOME}/dense-mem-stage/migration-rehearsal.lock"
          if ! flock --wait 600 9; then
            echo "::error::Timed out waiting for the staging migration lock"
            exit 1
          fi

          docker pull "${IMAGE_TAG}"
          image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE_TAG}")"
          if [[ ! "${image_ref}" =~ ^ghcr\.io/[^@]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The pulled staging image did not expose an immutable registry digest"
            exit 1
          fi
          if [[ -n "${EXPECTED_PREVIEW_PR}" ]]; then
            preview_head="$(docker image inspect --format '{{ index .Config.Labels "io.dense-mem.preview.head" }}' "${IMAGE_TAG}")"
            preview_main="$(docker image inspect --format '{{ index .Config.Labels "io.dense-mem.preview.main" }}' "${IMAGE_TAG}")"
            preview_pr="$(docker image inspect --format '{{ index .Config.Labels "io.dense-mem.preview.pr" }}' "${IMAGE_TAG}")"
            if [[ "${preview_head}" != "${EXPECTED_HEAD}" || "${preview_main}" != "${EXPECTED_MAIN}" || "${preview_pr}" != "${EXPECTED_PREVIEW_PR}" ]]; then
              echo "::error::The pulled preview image labels do not match the authorized PR, head, and main revisions"
              exit 1
            fi
          fi

          deploy_status=0
          DENSE_MEM_IMAGE="${image_ref}" \
            docker compose up -d \
            --pull never \
            --no-deps \
            --wait \
            --wait-timeout 3000 \
            server || deploy_status=$?
          if (( deploy_status != 0 )); then
            container_id="$(docker compose ps -q server || true)"
            if [[ -n "${container_id}" ]]; then
              docker inspect --format 'server_status={{.State.Status}} exit_code={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${container_id}" >&2 || true
            fi
            exit "${deploy_status}"
          fi

          {
            echo "## Staging deployment"
            echo
            echo "- Tag: \`${IMAGE_TAG}\`"
            echo "- Digest: \`${image_ref}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
