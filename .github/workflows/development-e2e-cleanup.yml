name: Clean development E2E images

on:
  workflow_run:
    workflows: [Development E2E]
    types: [completed]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: development-e2e-cleanup
  cancel-in-progress: false
  queue: max

jobs:
  cleanup:
    name: Clean owned development image versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted cleanup policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned regctl
        shell: bash
        run: bash .github/scripts/install-regctl.sh "${RUNNER_TEMP}/regctl" "${RUNNER_TEMP}/development-regctl.json"
      - name: Log in to GHCR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "${GITHUB_TOKEN}" | "${RUNNER_TEMP}/regctl" registry login ghcr.io -u "${GITHUB_ACTOR}" --pass-stdin
      - name: Clean completed development runs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGCTL_BIN: ${{ runner.temp }}/regctl
        run: node .github/scripts/development-e2e-cleanup.cjs
