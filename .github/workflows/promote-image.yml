name: Promote Docker image

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Existing prerelease image tag to promote (example: v1.0.0-rc.0)"
        required: true
        type: string
      release_tag:
        description: "Official release image tag to publish (example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  promote:
    name: Promote latest RC image
    runs-on: rootless-docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate promotion tags
        id: version
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must be a stable semantic version like v1.0.0"
            exit 1
          fi

          if [[ ! "${SOURCE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "::error::source_tag must be an RC prerelease tag like v1.0.0-rc.0"
            exit 1
          fi

          if [[ "${SOURCE_TAG}" != "${RELEASE_TAG}-rc."* ]]; then
            echo "::error::source_tag must belong to release_tag, for example ${RELEASE_TAG}-rc.0"
            exit 1
          fi

          git fetch --tags --force

          if ! git rev-parse -q --verify "refs/tags/${SOURCE_TAG}" >/dev/null; then
            echo "::error::source_tag does not exist as a Git tag: ${SOURCE_TAG}"
            exit 1
          fi

          latest_rc="$(git tag -l "${RELEASE_TAG}-rc.*" | sort -V | tail -n 1)"
          if [[ -z "${latest_rc}" ]]; then
            echo "::error::no RC tags found for ${RELEASE_TAG}"
            exit 1
          fi

          if [[ "${SOURCE_TAG}" != "${latest_rc}" ]]; then
            echo "::error::only the latest RC can be promoted. Latest for ${RELEASE_TAG} is ${latest_rc}"
            exit 1
          fi

          echo "source_tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker credentials path
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/.docker"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/.docker" >> "$GITHUB_ENV"

      - name: Log in to registry
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Promote image tags
        shell: bash
        run: |
          set -euo pipefail

          image="${{ steps.image.outputs.name }}"
          source_ref="${image}:${{ steps.version.outputs.source_tag }}"
          release_ref="${image}:${{ steps.version.outputs.release_tag }}"
          latest_ref="${image}:latest"

          docker buildx imagetools inspect "${source_ref}" >/dev/null
          docker buildx imagetools create \
            -t "${release_ref}" \
            -t "${latest_ref}" \
            "${source_ref}"
