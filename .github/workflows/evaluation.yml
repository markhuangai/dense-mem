name: Runner evaluation

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      source_repository:
        required: true
        type: string
      source_revision:
        required: true
        type: string
      mode:
        required: true
        type: string
      seed_version:
        type: string
        default: latest
      dataset_selection:
        type: string
        default: ''
      answer_workers:
        type: string
        default: '4'
      model:
        type: string
        default: ''
      context_window_tokens:
        type: string
        default: ''
    secrets:
      eval-model:
        required: false
      eval-context-window:
        required: false
      eval-verifier-url:
        required: false
      eval-embedding-url:
        required: false
      eval-api-key:
        required: false
      eval-embedding-api-key:
        required: false
      eval-team-api-key:
        required: false
      eval-database-password:
        required: false

permissions:
  actions: read
  contents: read
  packages: read

env:
  EVAL_DATASET_SELECTION: ${{ inputs.dataset_selection }}

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
      max_parallel: ${{ steps.registry.outputs.max_parallel }}
      answer_workers: ${{ steps.registry.outputs.answer_workers }}
      seed_images: ${{ steps.seeds.outputs.images }}
    steps:
      - &checkout-source
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - &setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - id: registry
        env:
          EVAL_MODE: ${{ inputs.mode }}
          EVAL_ANSWER_WORKERS: ${{ inputs.answer_workers }}
          EVAL_SOURCE_REVISION: ${{ inputs.source_revision }}
          EVAL_IMAGE: ${{ inputs.image }}
        run: node tests/eval/scripts/workflow.mjs matrix
      - uses: docker/login-action@v4
        if: inputs.mode == 'live'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pin selected public seeds before model work
        id: seeds
        if: inputs.mode == 'live'
        env:
          EVAL_MODE: live
          EVAL_SEED_VERSION: ${{ inputs.seed_version }}
          EVAL_SOURCE_REVISION: ${{ inputs.source_revision }}
          EVAL_IMAGE: ${{ inputs.image }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/eval/scripts/workflow.mjs pin-seeds

  datasets:
    name: ${{ inputs.mode == 'fixtures' && 'Prepare and score synthetic off seed' || format('Evaluate {0} ontology off', matrix.dataset) }}
    needs: registry
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.registry.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.registry.outputs.matrix) }}
    env:
      EVAL_MODE: ${{ inputs.mode }}
      EVAL_ANSWER_WORKERS: ${{ needs.registry.outputs.answer_workers }}
      EVAL_DATASET: ${{ matrix.dataset }}
      EVAL_IMAGE: ${{ inputs.image }}
      EVAL_SOURCE_REVISION: ${{ inputs.source_revision }}
      WORKFLOW_EMBEDDING_MODEL: 'text-embedding-3-small'
      EVAL_SEED_IMAGE: ${{ inputs.mode == 'live' && fromJSON(needs.registry.outputs.seed_images)[matrix.dataset].image || '' }}
      WORKFLOW_EMBEDDING_DIMENSIONS: '1536'
      DENSE_MEM_EVAL_MODEL: ${{ inputs.model || vars.DENSE_MEM_EVAL_MODEL || secrets.eval-model }}
      DENSE_MEM_EVAL_CONTEXT_WINDOW_TOKENS: ${{ inputs.context_window_tokens || vars.DENSE_MEM_EVAL_CONTEXT_WINDOW_TOKENS || secrets.eval-context-window }}
      DENSE_MEM_EVAL_VERIFIER_URL: ${{ secrets.eval-verifier-url }}
      DENSE_MEM_EVAL_EMBED_URL: ${{ secrets.eval-embedding-url }}
      DENSE_MEM_EVAL_API_KEY: ${{ secrets.eval-api-key }}
      DENSE_MEM_EVAL_EMBED_API_KEY: ${{ secrets.eval-embedding-api-key }}
      DENSE_MEM_EVAL_TEAM_API_KEY: ${{ secrets.eval-team-api-key }}
      DENSE_MEM_EVAL_DATABASE_PASSWORD: ${{ secrets.eval-database-password }}
    steps:
      - name: Freeze model deadline
        run: |
          minutes=330
          printf 'EVAL_MODEL_DEADLINE_EPOCH=%s\n' "$(( $(date +%s) + minutes * 60 ))" >> "${GITHUB_ENV}"
          printf 'EVAL_RUNNER_BINARY=%s/eval-runner\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - *checkout-source
      - *setup-node
      - name: Require verified seed pin
        if: inputs.mode == 'live' && env.EVAL_SEED_IMAGE == ''
        run: |
          echo "::error::Selected ontology-off seed could not be pinned. See the registry job."
          exit 1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build workflow-internal runner
        run: go build -trimpath -o "${EVAL_RUNNER_BINARY}" ./cmd/eval-runner
      - name: Set up isolated Docker
        uses: docker/setup-docker-action@v5
        with:
          rootless: true
          set-host: true
          daemon-config: |
            {"exec-opts":["native.cgroupdriver=cgroupfs"]}
      - name: Authenticate production image pull
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify seed exports, protected failures and owned cleanup
        if: inputs.mode == 'fixtures'
        run: node --test tests/eval/scripts/workflow_docker.test.mjs tests/eval/scripts/seed_docker.test.mjs
      - name: Score frozen ontology-off seed
        run: node tests/eval/scripts/workflow.mjs run
      - name: Preserve protected startup failure logs
        if: failure()
        run: node tests/eval/scripts/workflow.mjs diagnostics
      - name: Remove this job's runtime
        if: always()
        run: node tests/eval/scripts/workflow.mjs cleanup
      - name: Retain numeric report and reproducibility manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-${{ matrix.dataset }}-off
          path: ${{ runner.temp }}/dense-mem-eval-${{ github.run_id }}-${{ matrix.dataset }}-off/public/*.json
          retention-days: 2
          if-no-files-found: warn

  aggregate:
    name: Aggregate selected dataset outcomes
    needs: [registry, datasets]
    if: always() && needs.registry.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout-source
      - *setup-node
      - name: Download available numeric reports
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: evaluation-*
          path: ${{ runner.temp }}/evaluation-reports
      - name: Aggregate frozen dataset reports
        env:
          EVAL_MODE: ${{ inputs.mode }}
          EVAL_SOURCE_REVISION: ${{ inputs.source_revision }}
          EVAL_IMAGE: ${{ inputs.image }}
          EVAL_ANSWER_WORKERS: ${{ needs.registry.outputs.answer_workers }}
          EVAL_PINNED_SEEDS: ${{ needs.registry.outputs.seed_images }}
        run: node tests/eval/scripts/workflow.mjs aggregate
      - name: Retain scores including missing datasets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-comparison
          path: ${{ runner.temp }}/evaluation-reports/aggregate/comparison.json
          retention-days: 2
          if-no-files-found: error
