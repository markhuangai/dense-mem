name: Build evaluation seeds

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Complete public dataset to rebuild
        type: choice
        default: all
        options: [all, hotpotqa, musique, 2wikimultihopqa, nq_rear, popqa]
      workers:
        description: Concurrent Remember imports for one dataset (1–100)
        type: number
        default: 20

permissions: {}

jobs:
  registration:
    name: Require the implemented workflow revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain workflow registration
        run: |
          echo '::error::Seed building is registered but not implemented on this revision. Select the approved implementation branch to build seeds.'
          exit 1
