name: Build evaluation seeds

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Complete public dataset to rebuild
        type: choice
        default: all
        options: [all, hotpotqa, musique, 2wikimultihopqa, nq_rear, popqa]
      workers:
        description: Concurrent Remember imports for one dataset (1–100)
        type: number
        default: 20

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read
  issues: read
  statuses: read

concurrency:
  group: evaluation-seed-publication
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize public seed preparation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.image.outputs.image }}
      source_revision: ${{ steps.authorize.outputs.source_revision }}
      base_release: ${{ steps.authorize.outputs.base_release }}
      seed_version: ${{ steps.authorize.outputs.seed_version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      workers: ${{ steps.matrix.outputs.workers }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - id: authorize
        uses: actions/github-script@v9
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const { authorizeSeedBuild } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/evaluation-seeds.mjs`);
            const result = await authorizeSeedBuild(github, context, process.env.TRIGGERING_ACTOR);
            for (const [key, value] of Object.entries(result)) core.setOutput(key, value);
      - id: matrix
        env:
          EVAL_MODE: live
          INPUT_DATASET: ${{ inputs.dataset }}
          INPUT_WORKERS: ${{ inputs.workers }}
        run: node tests/eval/scripts/seed-workflow.mjs matrix
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pin supported production image
        id: image
        env:
          REQUESTED_IMAGE: ${{ steps.authorize.outputs.image }}
        run: |
          set -euo pipefail
          docker pull --quiet --platform linux/amd64 "${REQUESTED_IMAGE}" > /dev/null
          docker image inspect "${REQUESTED_IMAGE}" > "${RUNNER_TEMP}/seed-production-image.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { resolveEvaluationImage, requireEvaluationImportSupport } from "./.github/scripts/evaluation-policy.mjs";
          const inspected = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/seed-production-image.json`))[0];
          requireEvaluationImportSupport(inspected);
          const resolved = resolveEvaluationImage(process.env.REQUESTED_IMAGE, process.env.GITHUB_REPOSITORY, inspected);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `image=${resolved.image}\n`);
          NODE

  bootstrap:
    name: Verify shared evaluation bootstrap
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.bootstrap.outputs.image }}
    env:
      EVAL_MODE: live
      EVAL_DATASET: bootstrap
      EVAL_IMAGE: ${{ needs.authorize.outputs.image }}
      EVAL_SOURCE_REVISION: ${{ needs.authorize.outputs.source_revision }}
      EVAL_BASE_RELEASE: ${{ needs.authorize.outputs.base_release }}
      EVAL_SEED_VERSION: ${{ needs.authorize.outputs.seed_version }}
      DENSE_MEM_EVAL_IMPORT_WORKERS: ${{ needs.authorize.outputs.workers }}
      WORKFLOW_EMBEDDING_MODEL: text-embedding-3-small
      WORKFLOW_EMBEDDING_DIMENSIONS: '1536'
      DENSE_MEM_EVAL_MODEL: dense-mem-testing
      DENSE_MEM_EVAL_CONTEXT_WINDOW_TOKENS: '500000'
      DENSE_MEM_EVAL_VERIFIER_URL: ${{ vars.DENSE_MEM_EVAL_VERIFIER_URL || secrets.DENSE_MEM_EVAL_VERIFIER_URL }}
      DENSE_MEM_EVAL_EMBED_URL: https://api.openai.com/v1
      DENSE_MEM_EVAL_API_KEY: ${{ secrets.DENSE_MEM_EVAL_API_KEY }}
      DENSE_MEM_EVAL_EMBED_API_KEY: ${{ secrets.DENSE_MEM_EVAL_EMBED_API_KEY }}
      DENSE_MEM_EVAL_TEAM_API_KEY: ${{ secrets.DENSE_MEM_EVAL_TEAM_API_KEY }}
      DENSE_MEM_EVAL_DATABASE_PASSWORD: ${{ secrets.DENSE_MEM_EVAL_DATABASE_PASSWORD }}
    steps:
      - name: Freeze preparation deadline
        run: |
          printf 'EVAL_MODEL_DEADLINE_EPOCH=%s\n' "$(( $(date +%s) + 330 * 60 ))" >> "${GITHUB_ENV}"
          printf 'EVAL_RUNNER_BINARY=%s/eval-runner\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build workflow-internal runner
        run: go build -trimpath -o "${EVAL_RUNNER_BINARY}" ./cmd/eval-runner
      - uses: docker/setup-docker-action@v5
        with:
          rootless: true
          set-host: true
          daemon-config: |
            {"exec-opts":["native.cgroupdriver=cgroupfs"]}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create or verify the shared bootstrap
        id: bootstrap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/eval/scripts/seed-workflow.mjs bootstrap
      - name: Preserve protected startup failure evidence
        if: failure()
        run: node tests/eval/scripts/workflow.mjs diagnostics
      - name: Remove owned bootstrap runtime
        if: always()
        run: node tests/eval/scripts/seed-workflow.mjs cleanup

  datasets:
    name: Build ${{ matrix.dataset }} seed
    needs: [authorize, bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.authorize.outputs.matrix) }}
    env:
      EVAL_MODE: live
      EVAL_DATASET: ${{ matrix.dataset }}
      EVAL_IMAGE: ${{ needs.authorize.outputs.image }}
      EVAL_SOURCE_REVISION: ${{ needs.authorize.outputs.source_revision }}
      EVAL_BASE_RELEASE: ${{ needs.authorize.outputs.base_release }}
      EVAL_SEED_VERSION: ${{ needs.authorize.outputs.seed_version }}
      EVAL_SEED_IMAGE: ${{ needs.bootstrap.outputs.image }}
      DENSE_MEM_EVAL_IMPORT_WORKERS: ${{ needs.authorize.outputs.workers }}
      WORKFLOW_EMBEDDING_MODEL: text-embedding-3-small
      WORKFLOW_EMBEDDING_DIMENSIONS: '1536'
      DENSE_MEM_EVAL_MODEL: dense-mem-testing
      DENSE_MEM_EVAL_CONTEXT_WINDOW_TOKENS: '500000'
      DENSE_MEM_EVAL_VERIFIER_URL: ${{ vars.DENSE_MEM_EVAL_VERIFIER_URL || secrets.DENSE_MEM_EVAL_VERIFIER_URL }}
      DENSE_MEM_EVAL_EMBED_URL: https://api.openai.com/v1
      DENSE_MEM_EVAL_API_KEY: ${{ secrets.DENSE_MEM_EVAL_API_KEY }}
      DENSE_MEM_EVAL_EMBED_API_KEY: ${{ secrets.DENSE_MEM_EVAL_EMBED_API_KEY }}
      DENSE_MEM_EVAL_TEAM_API_KEY: ${{ secrets.DENSE_MEM_EVAL_TEAM_API_KEY }}
      DENSE_MEM_EVAL_DATABASE_PASSWORD: ${{ secrets.DENSE_MEM_EVAL_DATABASE_PASSWORD }}
    steps:
      - name: Freeze model deadline
        run: |
          printf 'EVAL_MODEL_DEADLINE_EPOCH=%s\n' "$(( $(date +%s) + 330 * 60 ))" >> "${GITHUB_ENV}"
          printf 'EVAL_RUNNER_BINARY=%s/eval-runner\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build workflow-internal runner
        run: go build -trimpath -o "${EVAL_RUNNER_BINARY}" ./cmd/eval-runner
      - uses: docker/setup-docker-action@v5
        with:
          rootless: true
          set-host: true
          daemon-config: |
            {"exec-opts":["native.cgroupdriver=cgroupfs"]}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Import, restore-test and publish this complete public dataset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/eval/scripts/seed-workflow.mjs build
      - name: Preserve protected startup failure evidence
        if: failure()
        run: node tests/eval/scripts/workflow.mjs diagnostics
      - name: Remove this dataset's runtime
        if: always()
        run: node tests/eval/scripts/seed-workflow.mjs cleanup
      - name: Retain numeric publication receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seed-${{ matrix.dataset }}
          path: ${{ runner.temp }}/dense-mem-eval-${{ github.run_id }}-${{ matrix.dataset }}/public/seed-build.json
          retention-days: 2
          if-no-files-found: warn
