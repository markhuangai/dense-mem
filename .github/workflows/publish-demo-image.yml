name: Publish demo Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing prerelease Git tag to publish, without refs/tags/ (example: v1.0.0-rc.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Existing prerelease Git tag to publish, without refs/tags/ (example: v1.0.0-rc.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish-demo:
    name: Build and push demo image
    runs-on: rootless-docker

    steps:
      - name: Validate prerelease tag
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then
            echo "::error::publish-demo-image only builds prerelease tags like v1.0.0-rc.0"
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Resolve image source metadata
        id: source
        shell: bash
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker credentials path
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/.docker"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/.docker" >> "$GITHUB_ENV"

      - name: Log in to registry
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "${GITHUB_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=demo-${{ steps.version.outputs.tag }}

      - name: Build and push demo image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.demo
          platforms: linux/amd64,linux/arm64/v8
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=demo-${{ steps.version.outputs.tag }}
            IMAGE_REVISION=${{ steps.source.outputs.revision }}
            IMAGE_CREATED=${{ steps.source.outputs.created }}
          cache-from: type=gha,scope=dense-mem-demo
          cache-to: type=gha,mode=max,scope=dense-mem-demo

      - name: Verify published demo image
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          REVISION: ${{ steps.source.outputs.revision }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 scripts/verify-container-image.py \
            --image "${IMAGE_NAME}:demo-${TAG}" \
            --variant demo \
            --platform linux/amd64 \
            --platform linux/arm64 \
            --max-compressed-bytes 22000000 \
            --revision "${REVISION}"
