name: Publish wiki

on:
  workflow_run:
    workflows: [Wiki source]
    branches: [wiki]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-publication
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Validate and publish wiki
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .lint
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned documentation tooling
        run: npm ci --prefix .lint --ignore-scripts --no-audit --no-fund
      - name: Publish current wiki source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/wiki-publication.cjs
