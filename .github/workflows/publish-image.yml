name: Publish prerelease Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing prerelease Git tag to publish, without refs/tags/ (example: v1.0.0-rc.0)"
        required: true
        type: string
      variant:
        description: Image variant to publish
        type: choice
        options: [production, demo]
        default: production
  workflow_call:
    inputs:
      tag:
        description: "Existing prerelease Git tag to publish, without refs/tags/ (example: v1.0.0-rc.0)"
        required: true
        type: string
      variant:
        description: Image variant to publish
        type: string
        default: production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: ${{ inputs.variant == 'demo' && 'Build and push demo image' || 'Build and push prerelease image' }}
    runs-on: ubuntu-latest

    steps:
      - name: Validate prerelease image inputs
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+$ ]] ||
            ! git check-ref-format "refs/tags/${tag}"; then
            echo "::error::publish-image only builds prerelease tags like v1.0.0-rc.0"
            exit 1
          fi

          case "${INPUT_VARIANT}" in
            production)
              version="${tag}"
              dockerfile=./Dockerfile
              target=production
              cache_scope=dense-mem-release
              ;;
            demo)
              version="demo-${tag}"
              dockerfile=./Dockerfile.demo
              target=
              cache_scope=dense-mem-demo
              ;;
            *)
              echo "::error::Invalid prerelease image variant. Choose production or demo."
              exit 1
              ;;
          esac

          printf 'Preparing %s image %s from Git tag %s\n' "${INPUT_VARIANT}" "${version}" "${tag}"
          printf '%s\n' "tag=${tag}" "version=${version}" "dockerfile=${dockerfile}" \
            "target=${target}" "cache_scope=${cache_scope}" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Resolve image source metadata
        id: source
        shell: bash
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker credentials path
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/.docker"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/.docker" >> "$GITHUB_ENV"

      - name: Log in to registry
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "${GITHUB_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.version.outputs.dockerfile }}
          target: ${{ steps.version.outputs.target }}
          platforms: linux/amd64,linux/arm64/v8
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
            IMAGE_REVISION=${{ steps.source.outputs.revision }}
            IMAGE_CREATED=${{ steps.source.outputs.created }}
          cache-from: type=gha,scope=${{ steps.version.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.version.outputs.cache_scope }}
