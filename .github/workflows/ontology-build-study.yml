name: Ontology build study
on:
  push:
    branches: [perf/ontology-build-study]
permissions:
  contents: read
env:
  ONTOLOGY_STUDY_VARIANT: rank-first

jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    env: &postgres
      DENSE_MEM_REPOSITORY_TESTCONTAINERS: "1"
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Compare frozen organization and Recall cohorts on real PostgreSQL
        env:
          ONTOLOGY_STUDY_REPORT_DIR: ${{ runner.temp }}/ontology-build-study
        shell: bash
        run: |
          set -euo pipefail
          for arm in base vector rank-first; do
            python3 tests/eval/scripts/ontology_build_study.py cohorts "$arm" "$ONTOLOGY_STUDY_REPORT_DIR"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: study-accuracy
          path: ${{ runner.temp }}/ontology-build-study/*.json
          if-no-files-found: error

  primary:
    name: Matched drains / ${{ matrix.dataset }}
    runs-on: ubuntu-latest
    timeout-minutes: 215
    strategy:
      fail-fast: false
      matrix:
        dataset: [hotpotqa, musique]
    env: *postgres
    steps: &measure
      - *checkout
      - *go
      - name: Compare three lookups from one frozen PostgreSQL template
        env:
          ONTOLOGY_STUDY_REPORT_DIR: ${{ runner.temp }}/ontology-build-study
          ONTOLOGY_STUDY_DATASET: ${{ matrix.dataset }}
        shell: bash
        run: |
          set -euo pipefail
          export ONTOLOGY_STUDY_VECTOR_SQL="$RUNNER_TEMP/ontology-study-vector.sql"
          python3 tests/eval/scripts/ontology_build_study.py render-vector "$ONTOLOGY_STUDY_VECTOR_SQL"
          python3 tests/eval/scripts/ontology_build_study.py render-lookup "$RUNNER_TEMP/ontology-lookups"
          go test -overlay="$RUNNER_TEMP/ontology-lookups/overlay.json" -tags=integration,ontology_study -count=1 -timeout=200m -run '^TestMatureOntologyBuildComparison$' -v ./internal/ontology/postgres
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: study-${{ matrix.dataset }}
          path: ${{ runner.temp }}/ontology-build-study/*.json
          if-no-files-found: error

  decision:
    name: Compare matched primary drains
    needs: [primary, accuracy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      advance: ${{ steps.compare.outputs.advance }}
    steps:
      - *checkout
      - uses: actions/download-artifact@v8
        with:
          pattern: study-*
          path: measurements
          merge-multiple: true
      - id: compare
        env:
          ONTOLOGY_STUDY_PREREQUISITES: ${{ (needs.primary.result == 'success' && needs.accuracy.result == 'success') && 'success' || 'failure' }}
        run: python3 tests/eval/scripts/ontology_build_study.py compare-lookups measurements hotpotqa musique
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: primary-comparison
          path: measurements/comparison.json

  remaining:
    name: Confirm matched drains / ${{ matrix.dataset }}
    needs: decision
    if: needs.decision.outputs.advance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 215
    env: *postgres
    strategy:
      fail-fast: false
      matrix:
        dataset: [2wikimultihopqa, nq_rear, popqa]
    steps: *measure

  result:
    needs: [decision, remaining]
    if: ${{ !cancelled() && needs.decision.outputs.advance == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: actions/download-artifact@v8
        with:
          pattern: study-*
          path: measurements
          merge-multiple: true
      - env:
          ONTOLOGY_STUDY_PREREQUISITES: ${{ needs.remaining.result }}
        run: python3 tests/eval/scripts/ontology_build_study.py compare-lookups measurements hotpotqa musique 2wikimultihopqa nq_rear popqa
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: five-shape-comparison
          path: measurements/comparison.json
