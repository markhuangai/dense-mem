name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  COVERAGE_THRESHOLD: "90.0"

jobs:
  go-unit:
    name: Go unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .lint/package-lock.json

      - name: Install lint dependencies
        run: npm ci --prefix .lint

      - name: Run repository lint
        run: npm run --prefix .lint lint:lines

      - name: Run Go tests
        run: go test ./...

      - name: Run unit coverage gate
        shell: bash
        run: |
          set -euo pipefail

          packages="$(
            go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./internal/... |
              sed '/^$/d' |
              grep -Ev '/repository$|/storage/(neo4j|postgres|redis)$'
          )"

          printf '%s\n' "${packages}"
          go test ${packages} -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out

          total="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
          awk \
            -v total="${total}" \
            -v threshold="${COVERAGE_THRESHOLD}" \
            'BEGIN {
              if ((total + 0) < (threshold + 0)) {
                printf("coverage %.1f%% is below required %.1f%%\n", total, threshold)
                exit 1
              }
              printf("coverage %.1f%% meets required %.1f%%\n", total, threshold)
            }'
