name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: false

      - name: Set up Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  result:
    name: CodeQL analysis
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require all language analyses
        uses: actions/github-script@v9
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo,
              run_id: context.runId,
              filter: 'all',
              per_page: 100,
            });
            for (const language of ['actions', 'go', 'javascript-typescript']) {
              const executions = jobs.filter(job => job.name === `Analyze (${language})` &&
                job.run_attempt <= Number(process.env.GITHUB_RUN_ATTEMPT));
              const latestAttempt = Math.max(...executions.map(job => job.run_attempt));
              const matches = executions.filter(job => job.run_attempt === latestAttempt);
              if (matches.length !== 1 || matches[0].status !== 'completed' || matches[0].conclusion !== 'success') {
                core.setFailed(`CodeQL ${language} has no successful latest execution.`);
              }
            }
