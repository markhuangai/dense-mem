name: Request PR image cleanup

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Closed pull request number; blank scans known preview tags"
        required: false
        type: string
      dry_run:
        description: "Report the deletion plan without changing GHCR"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  request:
    name: Record cleanup request
    runs-on: ubuntu-latest

    steps:
      - name: Validate and record request
        shell: bash
        env:
          REQUEST_PR_NUMBER: ${{ inputs.pr_number }}
          REQUEST_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUEST_PR_NUMBER}" && ! "${REQUEST_PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer when supplied"
            exit 1
          fi
          case "${REQUEST_DRY_RUN}" in
            true|false) ;;
            *) echo "::error::dry_run must be true or false"; exit 1 ;;
          esac
          mkdir -p "${RUNNER_TEMP}/pr-image-cleanup-request"
          jq -n \
            --arg pr_number "${REQUEST_PR_NUMBER}" \
            --argjson dry_run "${REQUEST_DRY_RUN}" \
            '{pr_number: $pr_number, dry_run: $dry_run}' \
            > "${RUNNER_TEMP}/pr-image-cleanup-request/request.json"

      - name: Upload trusted-workflow request
        uses: actions/upload-artifact@v7
        with:
          name: pr-image-cleanup-request
          path: ${{ runner.temp }}/pr-image-cleanup-request/request.json
          if-no-files-found: error
          retention-days: 1
