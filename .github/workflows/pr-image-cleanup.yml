name: Clean PR test image
run-name: "PR image cleanup: ${{ github.event.pull_request.number || github.event.workflow_run.head_sha || 'manual' }}"

on:
  schedule:
    - cron: "*/15 * * * *"
  pull_request_target:
    branches:
      - main
    types: [closed]
  workflow_run:
    workflows:
      - Release prerelease
      - Request PR image cleanup
    types:
      - completed

permissions:
  contents: read
  actions: read
  packages: write
  pull-requests: read

concurrency:
  group: pr-test-image-cleanup
  cancel-in-progress: false
  queue: max

jobs:
  cleanup:
    name: Resolve and clean preview versions
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          (
            github.event.workflow_run.name == 'Release prerelease' ||
            (github.event.workflow_run.name == 'Request PR image cleanup' && github.event.workflow_run.event == 'workflow_dispatch')
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Checkout trusted cleanup helper
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: main
          sparse-checkout: .github/scripts

      - name: Install pinned regctl
        shell: bash
        env:
          REGCTL_SHA256: c93aa7638749f5aaac1a8e01787321889c78f0101809bb2880343478d0ba0467
        run: |
          set -euo pipefail
          export REGCTL_CONFIG="${RUNNER_TEMP}/regctl-config.json"
          echo "REGCTL_CONFIG=${REGCTL_CONFIG}" >> "${GITHUB_ENV}"
          curl -fsSL -o "${RUNNER_TEMP}/regctl" \
            https://github.com/regclient/regclient/releases/download/v0.11.5/regctl-linux-amd64
          printf '%s  %s\n' "${REGCTL_SHA256}" "${RUNNER_TEMP}/regctl" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/regctl"
          "${RUNNER_TEMP}/regctl" config set --docker-cred=false --docker-cert=false

      - name: Log in to GHCR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "${GITHUB_TOKEN}" | "${RUNNER_TEMP}/regctl" registry login ghcr.io -u "${GITHUB_ACTOR}" --pass-stdin

      - name: Download manual cleanup request
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Request PR image cleanup' && github.event.workflow_run.event == 'workflow_dispatch'
        uses: actions/download-artifact@v8
        with:
          name: pr-image-cleanup-request
          path: ${{ runner.temp }}/pr-image-cleanup-request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve manual cleanup request
        id: request
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Request PR image cleanup' && github.event.workflow_run.event == 'workflow_dispatch'
        shell: bash
        env:
          REQUEST_FILE: ${{ runner.temp }}/pr-image-cleanup-request/request.json
        run: |
          set -euo pipefail
          test -f "${REQUEST_FILE}"
          pr_number="$(jq -r '.pr_number' "${REQUEST_FILE}")"
          dry_run="$(jq -r '.dry_run' "${REQUEST_FILE}")"
          allow_legacy="$(jq -r '.allow_legacy' "${REQUEST_FILE}")"
          if [[ -n "${pr_number}" && ! "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::manual cleanup request has an invalid pull request number"
            exit 1
          fi
          case "${dry_run}" in
            true|false) ;;
            *) echo "::error::manual cleanup request has an invalid dry_run value"; exit 1 ;;
          esac
          case "${allow_legacy}" in
            true|false) ;;
            *) echo "::error::manual cleanup request has an invalid allow_legacy value"; exit 1 ;;
          esac
          if [[ "${allow_legacy}" == "true" && -z "${pr_number}" ]]; then
            echo "::error::allow_legacy requires a single pull request number"
            exit 1
          fi
          printf 'pr_number=%s\n' "${pr_number}" >> "${GITHUB_OUTPUT}"
          printf 'dry_run=%s\n' "${dry_run}" >> "${GITHUB_OUTPUT}"
          printf 'allow_legacy=%s\n' "${allow_legacy}" >> "${GITHUB_OUTPUT}"

      - name: Resolve cleanup mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUEST_PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          REQUEST_DRY_RUN: ${{ steps.request.outputs.dry_run }}
          REQUEST_ALLOW_LEGACY: ${{ steps.request.outputs.allow_legacy }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_run" && -n "${REQUEST_DRY_RUN}" ]]; then
            printf 'CLEANUP_PR_NUMBER=%s\n' "${REQUEST_PR_NUMBER}" >> "${GITHUB_ENV}"
            printf 'CLEANUP_DRY_RUN=%s\n' "${REQUEST_DRY_RUN}" >> "${GITHUB_ENV}"
            printf 'CLEANUP_ALLOW_LEGACY=%s\n' "${REQUEST_ALLOW_LEGACY}" >> "${GITHUB_ENV}"
            echo 'CLEANUP_MANUAL_SWEEP=true' >> "${GITHUB_ENV}"
          elif [[ "${EVENT_NAME}" == "schedule" ]]; then
            echo 'CLEANUP_DRY_RUN=false' >> "${GITHUB_ENV}"
            echo 'CLEANUP_MANUAL_SWEEP=true' >> "${GITHUB_ENV}"
          else
            echo 'CLEANUP_DRY_RUN=false' >> "${GITHUB_ENV}"
            echo 'CLEANUP_MANUAL_SWEEP=false' >> "${GITHUB_ENV}"
          fi

      - name: Require admin for destructive manual cleanup
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Request PR image cleanup' && github.event.workflow_run.event == 'workflow_dispatch' && steps.request.outputs.dry_run == 'false'
        uses: actions/github-script@v9
        env:
          DOWNSTREAM_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const originalActor = run?.actor?.login;
            const upstreamTriggeringActor = run?.triggering_actor?.login;
            const downstreamTriggeringActor = process.env.DOWNSTREAM_ACTOR;
            if (!originalActor || (Number(run.run_attempt || 1) > 1 && !upstreamTriggeringActor) || !downstreamTriggeringActor) {
              core.setFailed("manual cleanup request has no authenticated actor");
              return;
            }
            const actors = [...new Set([originalActor, upstreamTriggeringActor, downstreamTriggeringActor].filter(Boolean))];
            for (const actor of actors) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor,
              });
              if (data.permission !== "admin") {
                core.setFailed(`destructive manual cleanup requires repository-admin permission for ${actor}`);
                return;
              }
            }

      - name: Clean closed pull request images
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLEANUP_PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          CLEANUP_BATCH_LIMIT: "200"
          REGCTL_BIN: ${{ runner.temp }}/regctl
        run: node .github/scripts/pr-image-cleanup.cjs
