name: GitVibe automatic PR review
run-name: "[git-vibe][automatic-pr-review]: PR #${{ github.event.pull_request.number }}"

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main

concurrency:
  group: git-vibe-automatic-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve-fork-review:
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name != github.repository }}
    name: approve fork PR review
    runs-on: docker-runner
    timeout-minutes: 5
    permissions: {}
    environment:
      name: gitvibe-pr-review
      deployment: false
    steps:
      - name: Approval received
        run: echo "Approved GitVibe review for fork PR #${{ github.event.pull_request.number }}"

  review:
    needs: approve-fork-review
    if: ${{ always() && !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' && !github.event.pull_request.draft && (github.event.pull_request.head.repo.full_name == github.repository || needs.approve-fork-review.result == 'success') }}
    permissions:
      id-token: write
      actions: write
      contents: read
      issues: write
      pull-requests: write
    uses: markhuangai/git-vibe/.github/workflows/review.yml@dev
    with:
      pr-number: ${{ format('{0}', github.event.pull_request.number) }}
      runner: docker-runner
      timeout_minutes: 60
      max_turns: 200
      source-comment: ""
    secrets:
      GITVIBE_AI_ENV_JSON: ${{ secrets.GITVIBE_AI_ENV_JSON }}
      GITVIBE_MCP_ENV_JSON: ${{ secrets.GITVIBE_MCP_ENV_JSON }}
