name: Production E2E scenario

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      scenario:
        required: true
        type: string
      timeout_minutes:
        required: true
        type: number
      manifest:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  scenario:
    name: Run ${{ inputs.scenario }}
    # The rootless-docker pool shares the CI user's daemon and home for shared-stack jobs.
    runs-on: rootless-docker
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      DENSE_MEM_CI_REPOSITORY: ${{ github.repository }}
      PHASE: ${{ inputs.manifest != '' && 'shared' || 'exclusive' }}
      SCENARIO: ${{ inputs.scenario }}
    steps:
      - name: Validate scenario input
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SCENARIO}" =~ ^[a-z0-9_]+$ ]] || {
            printf '%s\n' "scenario input must contain only lowercase letters, digits, and underscores" >&2
            exit 1
          }

      - name: Checkout exact tested revision
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Validate rootless controller
        shell: bash
        run: '"${HOME}/dense-mem-ci/e2e-stack.sh" doctor'

      - name: Resolve scenario configuration
        id: configuration
        shell: bash
        env:
          DENSE_MEM_E2E_SCENARIO_REGISTRY: ${{ github.workspace }}/scripts/e2e-scenarios.json
        run: |
          set -euo pipefail
          classification="$(node "${HOME}/dense-mem-ci/e2e-scenario-registry.mjs" --scenario "${SCENARIO}")"
          node - "${classification}" "${PHASE}" <<'NODE'
          const classification = JSON.parse(process.argv[2]);
          const phase = process.argv[3];
          const isolation = phase === "shared" ? "shared_team" : "exclusive";
          if (
            classification.audited !== true ||
            classification.runtime !== "production" ||
            classification.isolation !== isolation
          ) {
            process.stderr.write("scenario is not audited for the requested production phase\n");
            process.exit(1);
          }
          NODE
          helpers="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.helper_profiles.join(","));' "${classification}")"
          playwright="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.playwright ? "1" : "0");' "${classification}")"
          {
            printf 'helpers=%s\n' "${helpers}"
            printf 'playwright=%s\n' "${playwright}"
          } >> "${GITHUB_OUTPUT}"

      - name: Start isolated stack
        id: isolated
        if: env.PHASE == 'exclusive'
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          HELPERS: ${{ steps.configuration.outputs.helpers }}
          TEST_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "${IMAGE}" =~ ^(.+)@(sha256:[0-9a-f]{64})$ ]] || {
            printf '%s\n' "image must be pinned by digest" >&2
            exit 1
          }
          manifest="$("${HOME}/dense-mem-ci/e2e-stack.sh" start "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" exclusive "${SCENARIO}" "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${TEST_REVISION}" "${HELPERS}" "${GITHUB_WORKSPACE}")"
          {
            echo "manifest<<DENSE_MEM_MANIFEST"
            echo "${manifest}"
            echo "DENSE_MEM_MANIFEST"
          } >> "${GITHUB_OUTPUT}"

      - name: Use shared stack manifest
        id: shared
        if: env.PHASE == 'shared'
        env:
          MANIFEST: ${{ inputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${MANIFEST}" ]]
          {
            echo "manifest<<DENSE_MEM_MANIFEST"
            echo "${MANIFEST}"
            echo "DENSE_MEM_MANIFEST"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate runtime manifest
        env:
          MANIFEST: ${{ steps.isolated.outputs.manifest || steps.shared.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${MANIFEST}" > "${RUNNER_TEMP}/dense-mem-e2e-manifest.json"
          "${HOME}/dense-mem-ci/e2e-stack.sh" validate "${RUNNER_TEMP}/dense-mem-e2e-manifest.json"

      - name: Run exact-revision scenario child
        id: run
        if: always()
        continue-on-error: true
        env:
          DENSE_MEM_CI_RUN_PLAYWRIGHT: ${{ steps.configuration.outputs.playwright }}
          MANIFEST: ${{ steps.isolated.outputs.manifest || steps.shared.outputs.manifest }}
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/dense-mem-e2e-${SCENARIO}.log"
          : > "${log}"
          status=1
          if [[ -n "${MANIFEST}" ]]; then
            printf '%s\n' "${MANIFEST}" > "${RUNNER_TEMP}/dense-mem-e2e-manifest.json"
            "${HOME}/dense-mem-ci/e2e-stack.sh" run "${RUNNER_TEMP}/dense-mem-e2e-manifest.json" "${GITHUB_WORKSPACE}" "${SCENARIO}" 2>&1 |
              tail -c 262144 > "${log}"
            status=${PIPESTATUS[0]}
          else
            echo "scenario setup did not produce a runtime manifest" > "${log}"
          fi
          printf '%s\n' "${status}" > "${RUNNER_TEMP}/dense-mem-e2e-${SCENARIO}.status"
          exit "${status}"

      - name: Bound scenario diagnostics
        if: always()
        env:
          SCENARIO: ${{ inputs.scenario }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/dense-mem-e2e-${SCENARIO}.log"
          if [[ -f "${log}" ]]; then
            tail -c 262144 "${log}" > "${log}.bounded"
            mv -- "${log}.bounded" "${log}"
          fi

      - name: Stop isolated stack
        if: always() && env.PHASE == 'exclusive' && steps.isolated.outputs.manifest != ''
        env:
          MANIFEST: ${{ steps.isolated.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          project="$(node -e 'const value=JSON.parse(process.env.MANIFEST); process.stdout.write(value.compose_project);')"
          if ! "${HOME}/dense-mem-ci/e2e-stack.sh" stop "${project}"; then
            printf '%s\n' 1 > "${RUNNER_TEMP}/dense-mem-e2e-${SCENARIO}.status"
            exit 1
          fi

      - name: Preserve scenario result
        if: always()
        env:
          SCENARIO: ${{ inputs.scenario }}
        shell: bash
        run: |
          set -euo pipefail
          status_file="${RUNNER_TEMP}/dense-mem-e2e-${SCENARIO}.status"
          if [[ ! -f "${status_file}" ]]; then
            printf '%s\n' 1 > "${status_file}"
          fi
          status="$(cat "${status_file}")"
          [[ "${status}" =~ ^[0-9]+$ ]] || exit 1
          [[ "${status}" == "0" ]] || exit "${status}"

      - name: Upload bounded scenario diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dense-mem-e2e-${{ env.PHASE }}-${{ env.SCENARIO }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dense-mem-e2e-${{ env.SCENARIO }}.log
            ${{ runner.temp }}/dense-mem-e2e-${{ env.SCENARIO }}.status
          if-no-files-found: warn
          retention-days: 3
