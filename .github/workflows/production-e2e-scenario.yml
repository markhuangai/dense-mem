name: Production E2E scenario

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      scenario:
        required: true
        type: string
      timeout_minutes:
        required: true
        type: number
      shared_project:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  scenario:
    name: Run ${{ inputs.scenario }}
    runs-on: rootless-docker
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      DENSE_MEM_CI_REPOSITORY: ${{ github.repository }}
      PHASE: ${{ inputs.shared_project != '' && 'shared' || 'exclusive' }}
      SCENARIO: ${{ inputs.scenario }}
      SHARED_PROJECT: ${{ inputs.shared_project }}
    steps:
      - name: Validate scenario input
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SCENARIO}" =~ ^[a-z0-9_]+$ ]] || {
            printf '%s\n' "scenario input must contain only lowercase letters, digits, and underscores" >&2
            exit 1
          }

      - name: Checkout exact tested revision
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate rootless controller
        shell: bash
        run: scripts/e2e-host-controller.sh doctor

      - name: Resolve scenario configuration
        id: configuration
        shell: bash
        env:
          DENSE_MEM_E2E_SCENARIO_REGISTRY: ${{ github.workspace }}/scripts/e2e-scenarios.json
        run: |
          set -euo pipefail
          classification="$(node scripts/e2e-scenario-registry.mjs --scenario "${SCENARIO}")"
          node - "${classification}" "${PHASE}" <<'NODE'
          const classification = JSON.parse(process.argv[2]);
          const phase = process.argv[3];
          const isolation = phase === "shared" ? "shared_team" : "exclusive";
          if (
            classification.audited !== true ||
            classification.runtime !== "production" ||
            classification.isolation !== isolation
          ) {
            process.stderr.write("scenario is not audited for the requested production phase\n");
            process.exit(1);
          }
          NODE
          helpers="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.helper_profiles.join(","));' "${classification}")"
          playwright="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.playwright ? "1" : "0");' "${classification}")"
          {
            printf 'helpers=%s\n' "${helpers}"
            printf 'playwright=%s\n' "${playwright}"
          } >> "${GITHUB_OUTPUT}"

      - name: Start exclusive stack
        id: isolated
        if: env.PHASE == 'exclusive'
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          [[ "${IMAGE}" =~ ^(.+)@(sha256:[0-9a-f]{64})$ ]] || {
            printf '%s\n' "image must be pinned by digest" >&2
            exit 1
          }
          project="$(scripts/e2e-host-controller.sh start "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" exclusive "${SCENARIO}" "${IMAGE}" "${GITHUB_WORKSPACE}")"
          printf 'project=%s\n' "${project}" >> "${GITHUB_OUTPUT}"

      - name: Use shared stack
        id: shared
        if: env.PHASE == 'shared'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SHARED_PROJECT}" =~ ^densemem-ci-[a-z0-9][a-z0-9-]{0,50}$ ]]

      - name: Run scenario
        id: run
        if: always()
        continue-on-error: true
        env:
          DENSE_MEM_CI_RUN_PLAYWRIGHT: ${{ steps.configuration.outputs.playwright }}
          IMAGE: ${{ inputs.image }}
          ISOLATED_PROJECT: ${{ steps.isolated.outputs.project }}
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/dense-mem-e2e-${SCENARIO}.log"
          : > "${log}"
          status=1
          project="${SHARED_PROJECT:-${ISOLATED_PROJECT}}"
          stack_scenario="${SHARED_PROJECT:+shared}"
          stack_scenario="${stack_scenario:-${SCENARIO}}"
          if [[ -n "${project}" ]]; then
            printf 'Running %s production E2E scenario in the %s phase (project %s)\n' \
              "${SCENARIO}" "${PHASE}" "${project}"
            scripts/e2e-host-controller.sh run \
              "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${PHASE}" "${stack_scenario}" \
              "${SCENARIO}" "${IMAGE}" "${GITHUB_WORKSPACE}" 2>&1 |
              tee "${log}"
            pipeline_status=("${PIPESTATUS[@]}")
            status=${pipeline_status[0]}
            if ((pipeline_status[1] != 0)); then
              printf '%s\n' "scenario log capture failed" >&2
              status=1
            fi
          else
            printf '%s\n' "scenario setup did not produce a Compose project" | tee "${log}"
          fi
          printf 'Scenario %s exited with status %s\n' "${SCENARIO}" "${status}"
          printf '%s\n' "${status}" > "${RUNNER_TEMP}/dense-mem-e2e-${SCENARIO}.status"
          exit "${status}"

      - name: Stop isolated stack
        if: always() && env.PHASE == 'exclusive' && steps.isolated.outputs.project != ''
        env:
          PROJECT: ${{ steps.isolated.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          if ! scripts/e2e-host-controller.sh stop "${PROJECT}"; then
            printf '%s\n' 1 > "${RUNNER_TEMP}/dense-mem-e2e-${SCENARIO}.status"
            exit 1
          fi

      - name: Print failed scenario diagnostics
        if: always()
        env:
          SCENARIO: ${{ inputs.scenario }}
        shell: bash
        run: |
          set -euo pipefail
          status_file="${RUNNER_TEMP}/dense-mem-e2e-${SCENARIO}.status"
          log="${RUNNER_TEMP}/dense-mem-e2e-${SCENARIO}.log"
          status="1"
          if [[ -f "${status_file}" ]]; then
            status="$(cat "${status_file}")"
          fi
          [[ "${status}" == "0" ]] && exit 0
          [[ -f "${log}" ]] || exit 0
          stop_marker="$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
          printf '::stop-commands::%s\n' "${stop_marker}"
          printf '%s\n' "Bounded diagnostics for failed scenario ${SCENARIO}:"
          tail -c 262144 "${log}"
          printf '\n::%s::\n' "${stop_marker}"

      - name: Preserve scenario result
        if: always()
        env:
          SCENARIO: ${{ inputs.scenario }}
        shell: bash
        run: |
          set -euo pipefail
          status_file="${RUNNER_TEMP}/dense-mem-e2e-${SCENARIO}.status"
          if [[ ! -f "${status_file}" ]]; then
            printf '%s\n' 1 > "${status_file}"
          fi
          status="$(cat "${status_file}")"
          [[ "${status}" =~ ^[0-9]+$ ]] || exit 1
          [[ "${status}" == "0" ]] || exit "${status}"
