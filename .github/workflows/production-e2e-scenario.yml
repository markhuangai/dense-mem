name: Production E2E scenario

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      digest:
        required: true
        type: string
      source_revision:
        required: true
        type: string
      source_repository:
        required: true
        type: string
      scenario:
        required: true
        type: string
      phase:
        required: true
        type: string
      timeout_minutes:
        required: true
        type: number
      helper_profiles:
        required: true
        type: string
      playwright:
        required: true
        type: boolean
      manifest:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  scenario:
    name: Run ${{ inputs.scenario }}
    # This label is assigned only to runners sharing the CI user's rootless daemon and home.
    runs-on: [rootless-docker, rootless-docker-shared]
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      DENSE_MEM_CI_REPOSITORY: ${{ github.repository }}
      DENSE_MEM_CI_RUN_PLAYWRIGHT: ${{ inputs.playwright && '1' || '0' }}
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.source_revision }}
          repository: ${{ inputs.source_repository }}

      - name: Validate rootless controller
        shell: bash
        run: "${HOME}/dense-mem-ci/e2e-stack.sh doctor"

      - name: Start isolated stack
        id: isolated
        if: inputs.phase == 'exclusive'
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
          SCENARIO: ${{ inputs.scenario }}
          HELPERS: ${{ inputs.helper_profiles }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          helpers="$(printf '%s' "${HELPERS}" | node -e 'const fs=require("node:fs"); const values=JSON.parse(fs.readFileSync(0,"utf8")); process.stdout.write(values.join(","));')"
          manifest="$("${HOME}/dense-mem-ci/e2e-stack.sh" start "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" exclusive "${SCENARIO}" "${IMAGE}" "${DIGEST}" "${SOURCE_REVISION}" "${helpers}" "${GITHUB_WORKSPACE}")"
          {
            echo "manifest<<DENSE_MEM_MANIFEST"
            echo "${manifest}"
            echo "DENSE_MEM_MANIFEST"
          } >> "${GITHUB_OUTPUT}"

      - name: Use shared stack manifest
        id: shared
        if: inputs.phase == 'shared'
        env:
          MANIFEST: ${{ inputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${MANIFEST}" ]]
          {
            echo "manifest<<DENSE_MEM_MANIFEST"
            echo "${MANIFEST}"
            echo "DENSE_MEM_MANIFEST"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate runtime manifest
        env:
          MANIFEST: ${{ steps.isolated.outputs.manifest || steps.shared.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${MANIFEST}" > "${RUNNER_TEMP}/dense-mem-e2e-manifest.json"
          "${HOME}/dense-mem-ci/e2e-stack.sh" validate "${RUNNER_TEMP}/dense-mem-e2e-manifest.json"

      - name: Run exact-revision scenario child
        id: run
        if: always()
        continue-on-error: true
        env:
          MANIFEST: ${{ steps.isolated.outputs.manifest || steps.shared.outputs.manifest }}
          SCENARIO: ${{ inputs.scenario }}
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/dense-mem-e2e-${SCENARIO}.log"
          : > "${log}"
          status=1
          if [[ -n "${MANIFEST}" ]]; then
            printf '%s\n' "${MANIFEST}" > "${RUNNER_TEMP}/dense-mem-e2e-manifest.json"
            "${HOME}/dense-mem-ci/e2e-stack.sh" run "${RUNNER_TEMP}/dense-mem-e2e-manifest.json" "${GITHUB_WORKSPACE}" "${SCENARIO}" 2>&1 |
              tail -c 262144 > "${log}"
            status=${PIPESTATUS[0]}
          else
            echo "scenario setup did not produce a runtime manifest" > "${log}"
          fi
          printf '%s\n' "${status}" > "${RUNNER_TEMP}/dense-mem-e2e-${SCENARIO}.status"
          exit "${status}"

      - name: Bound scenario diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/dense-mem-e2e-${{ inputs.scenario }}.log"
          if [[ -f "${log}" ]]; then
            tail -c 262144 "${log}" > "${log}.bounded"
            mv -- "${log}.bounded" "${log}"
          fi

      - name: Stop isolated stack
        if: always() && inputs.phase == 'exclusive' && steps.isolated.outputs.manifest != ''
        env:
          MANIFEST: ${{ steps.isolated.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          project="$(node -e 'const value=JSON.parse(process.env.MANIFEST); process.stdout.write(value.compose_project);')"
          if ! "${HOME}/dense-mem-ci/e2e-stack.sh" stop "${project}"; then
            printf '%s\n' 1 > "${RUNNER_TEMP}/dense-mem-e2e-${{ inputs.scenario }}.status"
            exit 1
          fi

      - name: Preserve scenario result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status_file="${RUNNER_TEMP}/dense-mem-e2e-${{ inputs.scenario }}.status"
          if [[ ! -f "${status_file}" ]]; then
            printf '%s\n' 1 > "${status_file}"
          fi
          status="$(cat "${status_file}")"
          [[ "${status}" =~ ^[0-9]+$ ]] || exit 1
          [[ "${status}" == "0" ]] || exit "${status}"

      - name: Upload bounded scenario diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dense-mem-e2e-${{ inputs.phase }}-${{ inputs.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dense-mem-e2e-${{ inputs.scenario }}.log
            ${{ runner.temp }}/dense-mem-e2e-${{ inputs.scenario }}.status
          if-no-files-found: warn
          retention-days: 3
