name: Production E2E scenario

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      source_repository:
        required: true
        type: string
      source_revision:
        required: true
        type: string
      scenario:
        required: true
        type: string
      isolation:
        required: true
        type: string
      timeout_minutes:
        required: true
        type: number
      cloudflare_account_id:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  scenario:
    name: Run ${{ inputs.scenario == 'full' && 'dreaming_telemetry_portal' || inputs.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      DENSE_MEM_CI_REPOSITORY: ${{ github.repository }}
      PHASE: ${{ inputs.isolation == 'shared_team' && 'shared' || 'exclusive' }}
      SCENARIO: ${{ inputs.scenario }}
      ISOLATION: ${{ inputs.isolation }}
    steps:
      - name: Validate scenario input
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SCENARIO}" =~ ^[a-z0-9_]+$ ]]
          [[ "${ISOLATION}" == "exclusive" || "${ISOLATION}" == "shared_team" ]]

      - name: Checkout exact tested revision
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.source_revision }}
          repository: ${{ inputs.source_repository }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up rootless Docker
        id: docker
        uses: docker/setup-docker-action@v5
        with:
          rootless: true
          set-host: true

      - name: Generate temporary CI configuration
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOCKER_HOST: unix://${{ steps.docker.outputs.sock }}
        run: bash scripts/e2e-ci-bootstrap.sh

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Validate rootless controller and scenario registry
        id: configuration
        shell: bash
        env:
          DENSE_MEM_E2E_SCENARIO_REGISTRY: ${{ github.workspace }}/scripts/e2e-scenarios.json
        run: |
          set -euo pipefail
          scripts/e2e-host-controller.sh doctor
          classification="$(node scripts/e2e-scenario-registry.mjs --scenario "${SCENARIO}")"
          node - "${classification}" "${ISOLATION}" <<'NODE'
          const classification = JSON.parse(process.argv[2]);
          const isolation = process.argv[3];
          if (classification.audited !== true ||
              classification.runtime !== "production" ||
              classification.isolation !== isolation) {
            process.stderr.write("scenario is not audited for the requested production phase\n");
            process.exit(1);
          }
          NODE
          playwright="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.playwright ? "1" : "0");' "${classification}")"
          printf 'playwright=%s\n' "${playwright}" >> "${GITHUB_OUTPUT}"

      - name: Start scenario stack
        id: stack
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          [[ "${IMAGE}" =~ ^(.+)@(sha256:[0-9a-f]{64})$ ]]
          project="$(scripts/e2e-host-controller.sh start \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${PHASE}" "${SCENARIO}" \
            "${IMAGE}" "${GITHUB_WORKSPACE}")"
          printf 'project=%s\n' "${project}" >> "${GITHUB_OUTPUT}"

      - name: Run scenario
        if: always()
        shell: bash
        env:
          DENSE_MEM_CI_RUN_PLAYWRIGHT: ${{ steps.configuration.outputs.playwright }}
          IMAGE: ${{ inputs.image }}
          PROJECT: ${{ steps.stack.outputs.project }}
        run: |
          set +e
          status=1
          if [[ -n "${PROJECT}" ]]; then
            printf 'Running %s production E2E scenario in project %s\n' "${SCENARIO}" "${PROJECT}"
            stop_marker="$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
            restore_workflow_commands() {
              if [[ -n "${stop_marker}" ]]; then
                printf '\n::%s::\n' "${stop_marker}"
                stop_marker=""
              fi
            }
            trap restore_workflow_commands EXIT
            printf '::stop-commands::%s\n' "${stop_marker}"
            scripts/e2e-host-controller.sh run \
              "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${PHASE}" "${SCENARIO}" \
              "${SCENARIO}" "${IMAGE}" "${GITHUB_WORKSPACE}" 2>&1
            status=$?
            restore_workflow_commands
            trap - EXIT
          else
            printf '%s\n' "scenario setup did not produce a Compose project"
          fi
          printf 'Scenario %s exited with status %s\n' "${SCENARIO}" "${status}"
          exit "${status}"

      - name: Stop scenario stack
        if: always() && steps.stack.outputs.project != ''
        shell: bash
        env:
          PROJECT: ${{ steps.stack.outputs.project }}
        run: |
          set -euo pipefail
          scripts/e2e-host-controller.sh stop "${PROJECT}"
