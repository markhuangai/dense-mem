name: Prepared Topic evaluation

on:
  workflow_call:
    inputs:
      image: {type: string, required: true}
      revision: {type: string, required: true}
      baseline: {type: string, required: true}
      base_revision: {type: string, required: true}
      seed_lock: {type: string, required: true}
      dataset_selection: {type: string, required: true}
      mode: {type: string, required: true}
      resume: {type: string, default: ''}
    secrets:
      eval-api-key: {required: true}
      eval-verifier-url: {required: true}
      eval-embedding-api-key: {required: true}
      eval-decision-api-key: {required: false}
      eval-team-api-key: {required: true}
      eval-database-password: {required: true}

permissions:
  contents: read
  packages: read
  actions: read

env:
  EVAL_MODE: ${{ inputs.mode }}
  EVAL_DATASET_SELECTION: ${{ inputs.dataset_selection }}

jobs:
  plan:
    name: Verify application images and lock five source seeds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      prepare: ${{ steps.matrix.outputs.prepare }}
      score: ${{ steps.matrix.outputs.score }}
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - &node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - &login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify checkpoint provenance
        if: inputs.resume != ''
        uses: actions/github-script@v9
        env:
          RESUME: ${{ inputs.resume }}
          SOURCE: ${{ inputs.revision }}
        with:
          script: |
            if (!/^[1-9][0-9]{0,15}$/.test(process.env.RESUME)) throw new Error('Invalid previous run');
            const {data: source} = await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(process.env.RESUME)});
            if (source.event !== 'workflow_dispatch' || source.head_sha !== process.env.SOURCE ||
                source.path !== '.github/workflows/production-image-e2e.yml' || source.run_attempt !== 1 ||
                source.status !== 'completed' || source.actor.login !== context.actor) throw new Error('Question checkpoint source differs from this approved head');
      - id: matrix
        name: Resolve immutable pairing
        env:
          EVAL_IMAGE: ${{ inputs.image }}
          EVAL_BASELINE_IMAGE: ${{ inputs.baseline }}
          EVAL_SOURCE_REVISION: ${{ inputs.revision }}
          EVAL_BASE_REVISION: ${{ inputs.base_revision }}
          EVAL_PAIR_LOCK: ${{ inputs.seed_lock }}
        run: node tests/eval/scripts/paired.mjs matrix

  prepare:
    name: Verify prepared ${{ matrix.arm }} ${{ matrix.dataset }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.plan.outputs.prepare) }}
    env:
      EVAL_PAIR_ARM: ${{ matrix.arm }}
      EVAL_PAIR_PHASE: verify
      EVAL_DATASET: ${{ matrix.dataset }}
      EVAL_IMAGE: ${{ matrix.image }}
      EVAL_SOURCE_REVISION: ${{ matrix.revision }}
      EVAL_SEED_IMAGE: ${{ matrix.seed }}
      EVAL_PARENT_SEED_IMAGE: ${{ matrix.parent }}
    steps:
      - *checkout
      - *node
      - &go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - &build
        name: Build trusted evaluation runner
        run: |
          go build -trimpath -o "${RUNNER_TEMP}/eval-runner" ./cmd/eval-runner
          printf 'EVAL_RUNNER_BINARY=%s/eval-runner\nEVAL_MODEL_DEADLINE_EPOCH=%s\n' "${RUNNER_TEMP}" "$(( $(date +%s) + 330 * 60 ))" >> "${GITHUB_ENV}"
      - &docker
        uses: docker/setup-docker-action@v5
        with:
          rootless: true
          set-host: true
          daemon-config: |
            {"exec-opts":["native.cgroupdriver=cgroupfs"]}
      - *login
      - &measure
        name: Run the selected measurement
        env:
          WORKFLOW_EMBEDDING_MODEL: text-embedding-3-small
          WORKFLOW_EMBEDDING_DIMENSIONS: '1536'
          DENSE_MEM_EVAL_MODEL: dense-mem-testing
          DENSE_MEM_EVAL_CONTEXT_WINDOW_TOKENS: '500000'
          DENSE_MEM_EVAL_EMBED_URL: https://api.openai.com/v1
          DENSE_MEM_EVAL_API_KEY: ${{ secrets.eval-api-key }}
          DENSE_MEM_EVAL_VERIFIER_URL: ${{ secrets.eval-verifier-url }}
          DENSE_MEM_EVAL_EMBED_API_KEY: ${{ secrets.eval-embedding-api-key }}
          DENSE_MEM_EVAL_TEAM_API_KEY: ${{ secrets.eval-team-api-key }}
          DENSE_MEM_EVAL_DATABASE_PASSWORD: ${{ secrets.eval-database-password }}
        run: node tests/eval/scripts/paired.mjs measure
      - &cleanup
        name: Remove this job's runtime
        if: always()
        run: node tests/eval/scripts/workflow.mjs cleanup
      - uses: actions/upload-artifact@v7
        with:
          name: pair-ready-${{ matrix.dataset }}-${{ matrix.arm }}
          path: ${{ runner.temp }}/dense-mem-eval-${{ github.run_id }}-${{ matrix.dataset }}-${{ matrix.arm }}-verify-0/public/preparation.json
          retention-days: 2
          if-no-files-found: error

  gate:
    name: Require ten verified prepared restores
    needs: [plan, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - *node
      - uses: actions/download-artifact@v8
        with:
          pattern: pair-ready-*
          path: ${{ runner.temp }}/pair-preparations
      - env:
          EVAL_PREPARE_MATRIX: ${{ needs.plan.outputs.prepare }}
        run: node tests/eval/scripts/paired.mjs gate

  score:
    name: ${{ matrix.dataset }} ${{ matrix.arm }} ${{ matrix.phase }} ${{ matrix.shard }}
    needs: [plan, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.score) }}
    env:
      EVAL_DATASET: ${{ matrix.dataset }}
      EVAL_IMAGE: ${{ matrix.image }}
      EVAL_SOURCE_REVISION: ${{ matrix.revision }}
      EVAL_SEED_IMAGE: ${{ matrix.seed }}
      EVAL_PARENT_SEED_IMAGE: ${{ matrix.parent }}
      EVAL_PAIR_ARM: ${{ matrix.arm }}
      EVAL_PAIR_PHASE: ${{ matrix.phase }}
      EVAL_PAIR_SHARD: ${{ matrix.shard }}
      EVAL_PAIR_SHARDS: ${{ matrix.shards }}
      EVAL_RESUME_RUN: ${{ inputs.resume }}
    steps:
      - *checkout
      - *node
      - *go
      - *build
      - *docker
      - *login
      - uses: actions/download-artifact@v8
        with:
          name: pair-ready-${{ matrix.dataset }}-${{ matrix.arm }}
          path: ${{ runner.temp }}/pair-ready
      - run: printf 'EVAL_EXPECTED_PREPARATION=%s/pair-ready/preparation.json\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - name: Locate previous question checkpoints
        if: inputs.resume != '' && matrix.phase == 'score'
        id: checkpoint
        uses: actions/github-script@v9
        env:
          PREVIOUS: ${{ inputs.resume }}
          ARTIFACT: pair-result-${{ matrix.phase }}-${{ matrix.dataset }}-${{ matrix.arm }}-${{ matrix.shard }}
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id:Number(process.env.PREVIOUS),name:process.env.ARTIFACT});
            if (data.artifacts.length > 1 || data.artifacts.some(a => a.expired)) throw new Error('Previous checkpoint is expired or ambiguous');
            if (data.artifacts.length) core.setOutput('id',String(data.artifacts[0].id));
      - uses: actions/download-artifact@v8
        if: steps.checkpoint.outputs.id != ''
        with:
          artifact-ids: ${{ steps.checkpoint.outputs.id }}
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume }}
          path: ${{ runner.temp }}/resume
      - if: steps.checkpoint.outputs.id != ''
        run: printf 'EVAL_RESUME_QUESTIONS=%s/resume/questions\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - *measure
      - *cleanup
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pair-result-${{ matrix.phase }}-${{ matrix.dataset }}-${{ matrix.arm }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/dense-mem-eval-${{ github.run_id }}-${{ matrix.dataset }}-${{ matrix.arm }}-${{ matrix.phase }}-${{ matrix.shard }}/public/
          retention-days: 2
          if-no-files-found: warn

  calibration:
    name: Calibrate real Topic assignment Decisions
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - *checkout
      - *go
      - name: Score the held-out Decision routing cases
        env:
          EVAL_SOURCE_REVISION: ${{ inputs.revision }}
          EVAL_DECISION_PROVIDER: ${{ vars.DENSE_MEM_EVAL_DECISION_PROVIDER }}
          DENSE_MEM_EVAL_DECISION_API_KEY: ${{ secrets.eval-decision-api-key }}
          EVAL_DECISION_CALIBRATION_OUTPUT: ${{ runner.temp }}/topic-decision-calibration.json
        run: go test -tags hosted_evaluation ./internal/topicassignment -run '^TestHostedTopicAssignmentDecisionHoldout$' -count=1 -timeout 30m
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: topic-decision-calibration
          path: ${{ runner.temp }}/topic-decision-calibration.json
          retention-days: 2
          if-no-files-found: error

  compare:
    name: Compare all paired results
    needs: [plan,score,calibration]
    if: always() && needs.plan.result == 'success' && needs.score.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - *node
      - uses: actions/download-artifact@v8
        with:
          pattern: pair-result-*
          path: ${{ runner.temp }}/paired-results
      - uses: actions/download-artifact@v8
        with:
          pattern: pair-ready-*
          path: ${{ runner.temp }}/pair-preparations
      - uses: actions/download-artifact@v8
        with:
          name: topic-decision-calibration
          path: ${{ runner.temp }}/decision-calibration
      - env:
          EVAL_SCORE_MATRIX: ${{ needs.plan.outputs.score }}
          EVAL_JOBS_RESULT: ${{ needs.score.result }}
        run: node tests/eval/scripts/paired.mjs aggregate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: paired-comparison
          path: ${{ runner.temp }}/paired-results/aggregate/comparison.json
          retention-days: 2
          if-no-files-found: error
