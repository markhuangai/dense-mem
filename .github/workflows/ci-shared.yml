name: CI Shared

on:
  workflow_call:
    inputs:
      migration-base-ref:
        description: "Revision to compare against for immutable migration checks."
        required: false
        type: string
        default: origin/main

permissions:
  contents: read

env:
  COVERAGE_THRESHOLD: "90.0"

jobs:
  npm-audit:
    name: NPM vulnerability audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run npm vulnerability audits
        shell: bash
        run: |
          set -euo pipefail
          audit_with_retry() {
            local prefix="$1"
            local attempt=1
            local max_attempts=4
            local output status sleep_seconds

            while (( attempt <= max_attempts )); do
              set +e
              output="$(npm audit --prefix "${prefix}" --audit-level=high \
                --fetch-retries=4 \
                --fetch-retry-factor=2 \
                --fetch-retry-mintimeout=1000 \
                --fetch-retry-maxtimeout=30000 \
                --fetch-timeout=30000 2>&1)"
              status=$?
              set -e
              printf '%s\n' "${output}"
              if (( status == 0 )); then
                return 0
              fi
              if ! grep -Eq 'npm (warn|error) (audit )?5[0-9]{2}\b|npm error code (E5[0-9]{2}|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENETUNREACH|ECONNREFUSED)' <<<"${output}"; then
                return "${status}"
              fi
              if (( attempt == max_attempts )); then
                printf 'npm audit failed after %d attempts for %s\n' "${max_attempts}" "${prefix}" >&2
                return "${status}"
              fi
              sleep_seconds=$((2 ** (attempt - 1)))
              printf 'Transient npm audit failure for %s; retrying in %ss (attempt %d/%d).\n' \
                "${prefix}" "${sleep_seconds}" "${attempt}" "${max_attempts}" >&2
              sleep "${sleep_seconds}"
              attempt=$((attempt + 1))
            done
          }

          audit_with_retry .lint
          audit_with_retry web
          audit_with_retry packages/mcp-proxy

  postgres-migrations:
    name: PostgreSQL migration integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate PostgreSQL migration history
        run: scripts/check-postgres-migrations.sh "${{ inputs.migration-base-ref }}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: false

      - name: Run PostgreSQL migration integration suite
        run: go test -tags=integration ./internal/storage/postgres -count=1

  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install lint dependencies
        run: npm ci --prefix .lint

      - name: Install MCP proxy dependencies
        run: npm ci --prefix packages/mcp-proxy

      - name: Run repository lint
        run: npm run --prefix .lint lint:lines

      - name: Run architecture conformance
        run: |
          node scripts/check-architecture.mjs
          node --test tests/uat/architecture_conformance.test.mjs

      - name: Run MCP proxy tests
        run: npm test --prefix packages/mcp-proxy

      - name: Run scheduled-dreaming timing test
        run: node --test tests/uat/team_dreaming_schedule.test.mjs

      - name: Run image release policy tests
        run: node --test tests/uat/image_release_policy.test.mjs

      - name: Run prerelease version tests
        run: node --test tests/uat/prerelease_version.test.mjs

      - name: Run Go vulnerability scan policy tests
        run: node --test tests/uat/go_vulnerability_scan_policy.test.mjs

      - name: Run AI PR review policy tests
        run: node --test tests/uat/ai_pr_review_policy.test.mjs

      - name: Run evaluation monitor shell test
        run: bash tests/eval/scripts/run_full_public_rag_eval_until_done_test.sh

      - name: Run Go tests
        shell: bash
        run: |
          set -euo pipefail

          packages="$(scripts/go-packages.sh)"

          printf '%s\n' "${packages}"
          go test ${packages}

      - name: Run pinned Go static analysis
        run: scripts/static-analysis.sh

      - name: Run Go vulnerability scan
        run: scripts/go-vulnerability-scan.sh

      - name: Run unit coverage gate
        shell: bash
        run: |
          set -euo pipefail

          packages="$(
            go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./internal/... |
              sed '/^$/d' |
              grep -Ev '/(evalharness|repository)$|/storage/(postgres|redis)$'
          )"

          printf '%s\n' "${packages}"
          go test ${packages} -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out

          total="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
          awk \
            -v total="${total}" \
            -v threshold="${COVERAGE_THRESHOLD}" \
            'BEGIN {
              if ((total + 0) < (threshold + 0)) {
                printf("coverage %.1f%% is below required %.1f%%\n", total, threshold)
                exit 1
              }
              printf("coverage %.1f%% meets required %.1f%%\n", total, threshold)
            }'
