name: CI Shared

on:
  workflow_call:
    inputs:
      source-repository:
        description: "Repository containing the verified PR revision."
        required: false
        type: string
        default: ""
      source-revision:
        description: "Exact verified PR revision; empty preserves the caller's checkout."
        required: false
        type: string
        default: ""
      migration-base-ref:
        description: "Revision to compare against for immutable migration checks."
        required: false
        type: string
        default: origin/main
    outputs:
      passed:
        description: "True only when all mandatory repository CI jobs succeeded."
        value: ${{ jobs.result.outputs.passed }}

permissions:
  contents: read

env:
  COVERAGE_THRESHOLD: "90.0"

jobs:
  npm-audit:
    name: NPM vulnerability audits
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ inputs.source-repository || github.repository }}
          ref: ${{ inputs.source-revision }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run npm vulnerability audits
        shell: bash
        run: |
          set -euo pipefail
          audit_with_retry() {
            local prefix="$1"
            local attempt=1
            local max_attempts=4
            local output status sleep_seconds

            while (( attempt <= max_attempts )); do
              set +e
              output="$(npm audit --prefix "${prefix}" --audit-level=high \
                --fetch-retries=4 \
                --fetch-retry-factor=2 \
                --fetch-retry-mintimeout=1000 \
                --fetch-retry-maxtimeout=30000 \
                --fetch-timeout=30000 2>&1)"
              status=$?
              set -e
              printf '%s\n' "${output}"
              if (( status == 0 )); then
                return 0
              fi
              if ! grep -Eq 'npm (warn|error) (audit )?5[0-9]{2}\b|npm (warn|error) audit network timeout\b|npm error code (E5[0-9]{2}|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENETUNREACH|ECONNREFUSED)' <<<"${output}"; then
                return "${status}"
              fi
              if (( attempt == max_attempts )); then
                printf 'npm audit failed after %d attempts for %s\n' "${max_attempts}" "${prefix}" >&2
                return "${status}"
              fi
              sleep_seconds=$((2 ** (attempt - 1)))
              printf 'Transient npm audit failure for %s; retrying in %ss (attempt %d/%d).\n' \
                "${prefix}" "${sleep_seconds}" "${attempt}" "${max_attempts}" >&2
              sleep "${sleep_seconds}"
              attempt=$((attempt + 1))
            done
          }

          audit_with_retry .lint
          audit_with_retry web
          audit_with_retry packages/mcp-proxy

  postgres-migrations:
    name: PostgreSQL migration history
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: ${{ inputs.source-repository || github.repository }}
          ref: ${{ inputs.source-revision }}

      - name: Fetch upstream migration baseline for forks
        if: inputs.source-repository != '' && inputs.source-repository != github.repository
        env:
          MIGRATION_BASE: ${{ inputs.migration-base-ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${MIGRATION_BASE}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "${MIGRATION_BASE}"

      - name: Validate PostgreSQL migration history
        run: scripts/check-postgres-migrations.sh "${{ inputs.migration-base-ref }}"

  quality:
    name: Repository and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ inputs.source-repository || github.repository }}
          ref: ${{ inputs.source-revision }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install lint dependencies
        run: npm ci --prefix .lint

      - name: Install MCP proxy dependencies
        run: npm ci --prefix packages/mcp-proxy

      - name: Install browser dependencies
        run: npm ci --prefix web

      - name: Run repository lint
        run: npm run --prefix .lint lint:lines

      - name: Run architecture conformance
        run: |
          node scripts/check-architecture.mjs
          node --test tests/uat/architecture_conformance.test.mjs
          node --test tests/uat/coverage_policy.test.mjs

      - name: Run synchronous-write harness tests
        run: node --test tests/uat/synchronous_write/*.test.mjs

      - name: Run embedding upstream fixture tests
        run: node --test tests/uat/embedding_upstream.test.mjs

      - name: Run ontology cleanup and session provider proxy regressions
        run: node --test tests/uat/ontology_organization_cleanup.test.mjs tests/eval/scripts/session_provider_proxy.test.mjs

      - name: Run E2E scenario-registry tests
        run: node --test tests/uat/e2e_scenario_registry.test.mjs

      - name: Run E2E host-controller unit tests
        run: node --test tests/uat/e2e_host_controller.test.mjs

      - name: Run MCP proxy tests
        run: npm run test:coverage --prefix packages/mcp-proxy

      - name: Run browser tests, coverage, and builds
        run: |
          npm run test:coverage --prefix web
          npm run build --prefix web

      - name: Enforce browser and MCP proxy statement coverage
        run: |
          node scripts/coverage-gate.mjs browser web/coverage/coverage-summary.json
          node scripts/coverage-gate.mjs "MCP proxy" packages/mcp-proxy/coverage/coverage-summary.json

      - name: Run scheduled-dreaming timing test
        run: node --test tests/uat/team_dreaming_schedule.test.mjs

      - name: Run image release policy tests
        run: |
          node --test tests/uat/staging_deployment.test.mjs
          node --test tests/uat/image_release_policy.test.mjs
          node --test tests/uat/preview_receipt.test.mjs tests/uat/fork_e2e_policy.test.mjs tests/uat/fork_e2e_workspace.test.mjs
          node --test tests/uat/fork_attestation_crypto.test.mjs
          node --test tests/uat/pr_image_cleanup.test.mjs
          node --test tests/uat/github_cleanup_api.test.mjs tests/uat/development_e2e.test.mjs
          node --test tests/uat/pr_image_cleanup_registry.test.mjs

      - name: Run prerelease version tests
        run: node --test tests/uat/prerelease_version.test.mjs

      - name: Run Go vulnerability scan policy tests
        run: node --test tests/uat/go_vulnerability_scan_policy.test.mjs

      - name: Run AI PR review policy tests
        run: node --test tests/uat/ai_pr_review_policy.test.mjs

      - name: Run PR validation policy tests
        run: node --test tests/uat/pr_validation_policy.test.mjs

      - name: Run evaluation monitor shell test
        run: bash tests/eval/scripts/run_full_public_rag_eval_until_done_test.sh

  go-tests:
    name: Go tests and analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ inputs.source-repository || github.repository }}
          ref: ${{ inputs.source-revision }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
          cache: false

      - name: Run Go tests
        shell: bash
        run: |
          set -euo pipefail

          packages="$(scripts/go-packages.sh)"

          printf '%s\n' "${packages}"
          go test -timeout=30m ${packages}
          go -C cmd/e2e test ./... -count=1

      - name: Run pinned Go static analysis
        run: scripts/static-analysis.sh

      - name: Run Go vulnerability scan
        run: scripts/go-vulnerability-scan.sh

  coverage:
    name: Go coverage ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [core, postgres]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ inputs.source-repository || github.repository }}
          ref: ${{ inputs.source-revision }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
          cache: false

      - name: Produce complete coverage part
        run: scripts/coverage-report.sh --complete-part '${{ matrix.part }}'
      - name: Upload source-bound coverage profiles
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/${{ matrix.part }}/
          if-no-files-found: error
          retention-days: 7

  coverage-merge:
    name: Complete Go coverage gate
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ inputs.source-repository || github.repository }}
          ref: ${{ inputs.source-revision }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
          cache: false

      - name: Download core coverage profiles
        uses: actions/download-artifact@v8
        with:
          name: go-coverage-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/core
      - name: Download PostgreSQL coverage profiles
        uses: actions/download-artifact@v8
        with:
          name: go-coverage-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/postgres
      - name: Run unit coverage gate
        run: scripts/coverage-report.sh --merge-complete

  python:
    name: Python ${{ matrix.python }} (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        sdk: [latest]
        include:
          - python: '3.12'
            sdk: minimum
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ inputs.source-repository || github.repository }}
          ref: ${{ inputs.source-revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validate installed Python package
        run: bash packages/python/scripts/check.sh --sdk '${{ matrix.sdk }}'

  result:
    name: Aggregate repository CI
    needs: [npm-audit, postgres-migrations, quality, go-tests, coverage, coverage-merge, python]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      passed: ${{ steps.result.outputs.passed }}
    steps:
      - name: Require every CI job
        id: result
        env:
          NPM_RESULT: ${{ needs.npm-audit.result }}
          MIGRATIONS_RESULT: ${{ needs.postgres-migrations.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          GO_RESULT: ${{ needs.go-tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          COVERAGE_MERGE_RESULT: ${{ needs.coverage-merge.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "${NPM_RESULT}" = success
          test "${MIGRATIONS_RESULT}" = success
          test "${QUALITY_RESULT}" = success
          test "${GO_RESULT}" = success
          test "${COVERAGE_RESULT}" = success
          test "${COVERAGE_MERGE_RESULT}" = success
          test "${PYTHON_RESULT}" = success
          echo 'passed=true' >> "${GITHUB_OUTPUT}"
