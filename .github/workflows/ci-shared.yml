name: CI Shared

on:
  workflow_call:

permissions:
  contents: read

env:
  COVERAGE_THRESHOLD: "90.0"

jobs:
  go-unit:
    name: Go unit tests
    runs-on: docker-runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            .lint/package-lock.json
            packages/mcp-proxy/package-lock.json

      - name: Install lint dependencies
        run: npm ci --prefix .lint

      - name: Install MCP proxy dependencies
        run: npm ci --prefix packages/mcp-proxy

      - name: Run npm vulnerability audits
        shell: bash
        run: |
          set -euo pipefail
          npm audit --prefix .lint --audit-level=high
          npm audit --prefix web --audit-level=high
          npm audit --prefix packages/mcp-proxy --audit-level=high

      - name: Run repository lint
        run: npm run --prefix .lint lint:lines

      - name: Run MCP proxy tests
        run: npm test --prefix packages/mcp-proxy

      - name: Run scheduled-dreaming timing test
        run: node --test tests/uat/team_dreaming_schedule.test.mjs

      - name: Run image release policy tests
        run: node --test tests/uat/image_release_policy.test.mjs

      - name: Run prerelease version tests
        run: node --test tests/uat/prerelease_version.test.mjs

      - name: Run evaluation monitor shell test
        run: bash tests/eval/scripts/run_full_public_rag_eval_until_done_test.sh

      - name: Run Go tests
        shell: bash
        run: |
          set -euo pipefail

          packages="$(scripts/go-packages.sh)"

          printf '%s\n' "${packages}"
          go test ${packages}

      - name: Run pinned Go static analysis
        run: scripts/static-analysis.sh

      - name: Run Go vulnerability scan
        run: go tool govulncheck ./...

      - name: Run concurrent startup migration test
        run: >-
          go test -tags=integration ./internal/storage/postgres
          -run '^TestMigratorRunUpSerializesConcurrentStartup$' -count=1

      - name: Run unit coverage gate
        shell: bash
        run: |
          set -euo pipefail

          packages="$(
            go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./internal/... |
              sed '/^$/d' |
              grep -Ev '/(evalharness|repository)$|/storage/(postgres|redis)$'
          )"

          printf '%s\n' "${packages}"
          go test ${packages} -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out

          total="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
          awk \
            -v total="${total}" \
            -v threshold="${COVERAGE_THRESHOLD}" \
            'BEGIN {
              if ((total + 0) < (threshold + 0)) {
                printf("coverage %.1f%% is below required %.1f%%\n", total, threshold)
                exit 1
              }
              printf("coverage %.1f%% meets required %.1f%%\n", total, threshold)
            }'
