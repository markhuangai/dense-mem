name: CI Shared

on:
  workflow_call:

permissions:
  contents: read

env:
  COVERAGE_THRESHOLD: "90.0"

jobs:
  go-unit:
    name: Go unit tests
    runs-on: docker-runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .lint/package-lock.json

      - name: Install lint dependencies
        run: npm ci --prefix .lint

      - name: Run repository lint
        run: npm run --prefix .lint lint:lines

      - name: Run container verifier unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/release -p 'test_*.py'

      - name: Run Go tests
        shell: bash
        run: |
          set -euo pipefail

          packages="$(
            git ls-files '*.go' |
              grep -Ev '^(tests/uat|tests/eval/runtime)/' |
              xargs -r -n1 dirname |
              sort -u |
              while IFS= read -r dir; do
                go list "./${dir#./}" 2>/dev/null || true
              done
          )"

          printf '%s\n' "${packages}"
          go test ${packages}

      - name: Run unit coverage gate
        shell: bash
        run: |
          set -euo pipefail

          packages="$(
            go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./internal/... |
              sed '/^$/d' |
              grep -Ev '/(evalharness|repository)$|/storage/(postgres|redis)$'
          )"

          printf '%s\n' "${packages}"
          go test ${packages} -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out

          total="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
          awk \
            -v total="${total}" \
            -v threshold="${COVERAGE_THRESHOLD}" \
            'BEGIN {
              if ((total + 0) < (threshold + 0)) {
                printf("coverage %.1f%% is below required %.1f%%\n", total, threshold)
                exit 1
              }
              printf("coverage %.1f%% meets required %.1f%%\n", total, threshold)
            }'

  migration-concurrency:
    name: Concurrent startup migrations
    runs-on: docker-runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache: false

      - name: Verify concurrent startup migrations
        run: >-
          go test -tags=integration ./internal/storage/postgres
          -run '^TestMigratorRunUpSerializesConcurrentStartup$' -count=1

  container-images:
    name: ${{ matrix.name }} image contract
    runs-on: rootless-docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            dockerfile: Dockerfile
            variant: release
            max_compressed_bytes: 30000000
            cache_scope: dense-mem-release
          - name: Demo
            dockerfile: Dockerfile.demo
            variant: demo
            max_compressed_bytes: 22000000
            cache_scope: dense-mem-demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve image metadata
        id: source
        shell: bash
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build multi-platform OCI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64/v8
          push: false
          provenance: false
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.variant }}.tar,compression=gzip
          build-args: |
            IMAGE_VERSION=ci
            IMAGE_REVISION=${{ steps.source.outputs.revision }}
            IMAGE_CREATED=${{ steps.source.outputs.created }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Verify image contract and compressed size
        run: |
          python3 scripts/verify-container-image.py \
            --oci-archive "${{ runner.temp }}/${{ matrix.variant }}.tar" \
            --variant "${{ matrix.variant }}" \
            --platform linux/amd64 \
            --platform linux/arm64 \
            --max-compressed-bytes "${{ matrix.max_compressed_bytes }}" \
            --revision "${{ steps.source.outputs.revision }}"
