version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    groups:
      go-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/.lint"
      - "/web"
      - "/packages/mcp-proxy"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    groups:
      docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    ignore:
      - dependency-name: "markhuangai/ai-pr-reviewer"
    groups:
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
