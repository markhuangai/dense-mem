# Copy this file to .github/git-vibe.yml in the consumer repository.

version: 1

permissions:
  # Users with write, maintain, or admin can approve automation.
  approver_roles:
    - write
    - maintain
    - admin

labels:
  story: gvi:story
  needs_discussion: gvi:needs-discussion
  investigate: git-vibe:investigate
  investigating: gvi:investigating
  investigated: gvi:investigated
  ready_for_approval: gvi:ready-for-approval
  approved: git-vibe:approved
  review: git-vibe:review
  reviewing: gvi:reviewing
  in_progress: gvi:in-progress
  blocked: gvi:blocked
  pr_opened: gvi:pr-opened
  pr_approved: gvi:pr-approved
  pr_merged: gvi:pr-merged
  validate: git-vibe:validate
  validating: gvi:validating
  validated: gvi:validated

commands:
  prefix: /git-vibe
  allow_external_agent_mentions: false

event_delivery:
  # Hosted GitHub App installs configure webhooks centrally; repositories do not create hooks.
  mode: webhook
  relay:
    provider: smee
    # GitHub Actions Secret name. Relay URLs may contain delivery tokens; do not commit the real URL.
    url_secret: GITVIBE_RELAY_URL
  actions_receiver:
    enabled: false
    scheduled_scan: "*/15 * * * *"
  polling:
    enabled: false
    interval_seconds: 300

github_auth:
  mode: github-app

safety:
  prompt_injection_gate: true
  
tests:
  commands: []

ai:
  security:
    web:
      # Default for public repositories: let AI search current GitHub project material only.
      # Add domains only for websites the repository owner trusts AI to search and fetch.
      allowed_domains:
        - github.com
        - "*.github.com"
  mcp:
    servers:
      dense_mem:
        transport: stdio
        command: npx
        args: [ "-y", "dense-mem-mcp-proxy" ]
        env:
          DENSE_MEM_API_KEY:
            from_bundle: DENSE_MEM_API_KEY
          DENSE_MEM_MCP_URL:
            from_bundle: DENSE_MEM_MCP_URL
  profiles:
    codex_5.4_mini_xhigh:
      adapter: codex-sdk
      api_key:
        from_bundle: GITVIBE_AI_API_KEY
      base_url:
        from_bundle: CODEX_AI_BASE_URL
      model: gpt-5.4-mini
      reasoning:
        effort: medium
        summary: concise
    local_proxy:
      adapter: claude-code-sdk
      env:
        ANTHROPIC_API_KEY:
          from_bundle: GITVIBE_AI_API_KEY
        ANTHROPIC_BASE_URL:
          from_bundle: GITVIBE_AI_BASE_URL
        ANTHROPIC_DEFAULT_OPUS_MODEL: auto
        ANTHROPIC_DEFAULT_SONNET_MODEL: auto
        ANTHROPIC_DEFAULT_HAIKU_MODEL: auto
        ANTHROPIC_MODEL: opus
        CLAUDE_CODE_SUBAGENT_MODEL: opus
      model: opus
      reasoning:
        effort: high
      provider_options:
        anthropic:
          effort: high
  role_groups:
    swarm:
      synthesizer: codex_5.4_mini_xhigh
      parallel: 6
      roles:
        - role: correctness.md
          profile: codex_5.4_mini_xhigh
        - role: security.md
          profile: codex_5.4_mini_xhigh
        - role: maintainability.md
          profile: codex_5.4_mini_xhigh
        - role: implemented-feature.md
          profile: codex_5.4_mini_xhigh
        - role: over-engineering.md
          profile: codex_5.4_mini_xhigh
        - role: test-evidence.md
          profile: codex_5.4_mini_xhigh
        - role: contract-compatibility.md
          profile: codex_5.4_mini_xhigh
        - role: data-integrity.md
          profile: codex_5.4_mini_xhigh
        - role: operations-readiness.md
          profile: codex_5.4_mini_xhigh
        - role: performance-cost.md
          profile: codex_5.4_mini_xhigh
  budgets:
    default_timeout_minutes: 60
    review_timeout_minutes: 60
    feedback_timeout_minutes: 120
    create_pr_timeout_minutes: 15
    default_max_turns: 200
    feedback_max_turns: 120
    validation_repair_attempts: 3
    validation_repair_max_turns: 45
    pr_feedback_max_iterations: 3
    request_retry_attempts: 3
    request_retry_delay_seconds: 60
  stages:
    investigate:
      role_group: swarm
      mcp:
        dense_mem:
          required: true
          tools:
            - recall_memory
            - assemble_context
            - get_memory
            - list_communities
            - get_community_summary
    validate:
      role_group: swarm
      mcp:
        dense_mem:
          required: true
          tools:
            - recall_memory
            - assemble_context
            - get_memory
            - list_communities
            - get_community_summary
    materialize:
      profile: local_proxy
      mcp:
        dense_mem:
          required: true
          tools:
            - recall_memory
            - assemble_context
            - get_memory
            - list_communities
            - get_community_summary
    review-matrix:
      role_group: swarm
      mcp:
        dense_mem:
          required: true
          tools:
            - recall_memory
            - assemble_context
            - get_memory
            - list_communities
            - get_community_summary
